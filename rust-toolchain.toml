# SPDX-License-Identifier: MPL-2.0
#
# Bumping `channel`, check:
# - The std overlay (userland/neoplutarch-std-overlay) still applies: run a
#   std_* scenario. Its anchors name rust-src seams and fail loudly if moved.
# - Cargo still honours __CARGO_TESTS_ONLY_SRC_ROOT, an undocumented internal
#   that points -Zbuild-std at xtask's overlaid copy of rust-src. xtask's
#   verify_std_built_from_copy fails the build if std came from anywhere else.
[toolchain]
channel = "nightly-2026-04-16"
components = ["rust-src", "llvm-tools-preview", "rustfmt", "clippy"]
targets = ["x86_64-unknown-none", "aarch64-unknown-none"]
profile = "minimal"
