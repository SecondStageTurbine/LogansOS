# SPDX-License-Identifier: MPL-2.0
[package]
name = "icon-raster"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

# Host only: rasterises assets/icons/*.svg to the straight-alpha RGBA8888
# blobs neo-atrium embeds (`atrium-app-icons`). Never a kernel or userland
# dependency. `resvg` (Apache-2.0 OR MIT) with its default features off: no
# text, no system fonts, no raster images; the icons are plain paths.
[dependencies]
resvg = { version = "0.49", default-features = false }
# `default-features = false`, as in xtask: with `std` on, workspace feature
# unification would enable it for the no_std kernel's blake3 too.
blake3 = { version = "1.8.2", default-features = false }
