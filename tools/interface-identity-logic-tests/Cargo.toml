# SPDX-License-Identifier: MPL-2.0
[package]
name = "interface-identity-logic-tests"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

# Mirror of the kernel `interface-identity` / `interface-caps` features so the
# mounted module's `cfg!(feature = "…")` is a *known* cfg on the host (silences
# `unexpected_cfgs` under `-D warnings`). Default-off; the KATs pass the `enabled`
# toggle explicitly and never depend on these features being set.
[features]
interface-identity = []
interface-caps = []
