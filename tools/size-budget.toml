# SPDX-License-Identifier: MPL-2.0
#
# L7.2 size budgets: subtraction as a gate.
#
# `cargo xtask size-budget` (CI product-build) measures image A and fails when
# a measured size is over its ceiling. The ceilings are the measured value at
# the commit that introduced this file plus a small margin; the margin is the
# noise allowance, not a second budget.
#
# Raising a ceiling is allowed, in the SAME PR that grows the image, and the
# `reason` must say what grew and why it pays for itself.

[kernel_text]
# Image A's kernel ELF `.text` section (the shipped code, opt-level 3,
# ub-checks off). Grows when a feature adds code; the budget makes that growth
# visible and deliberate rather than a silent drift.
ceiling_bytes = 1613279
reason = "image A kernel .text: 1,580,511 B measured by CI 2026-11-09 (PR #72 run 42555771453, head fc964d65 on main 9267789) + 32 KiB for codegen/toolchain noise. Raised from 1,549,279 (1,516,511 B, main 9267789 run 42556912418): #72 adds no code to image A (its kernel code is cfg pipe, not an image A feature, and its 576cd862 head on 018ddef0 measured 1,516,511 B exactly); the +64,000 B is the codegen-unit swing #82 showed, which Seat E's size-budget lane is fixing in the measurement. Before that, raised from 1,516,687 (1,483,919 B on 2026-10-31): #14 put power-cap (SYS_POWER and the OT-90 shutdown path) in image A's kernel, +67,152 B over main 0ecb5b11's 1,449,359 B; that left 176 B of the noise margin."

[iso]
# The model-less image A ISO: the product kernel plus the shipped desktop
# userland, licences and the Limine boot payload. The pinned Qwen2.5-0.5B model
# (485,489,152 B) and vocab (7,990,862 B) are staged from out-of-git files whose
# sizes the kernel pins at boot, so they cannot drift and are not in this
# budget. Grows when the kernel, userland or staged licences grow.
ceiling_bytes = 157499392
reason = "image A ISO (model-less): 156,450,816 B measured by CI 2026-11-09 (PR #72 run 42555771453, head fc964d65 on main 9267789) + 1 MiB for ISO metadata/alignment. Raised from 155,756,544 (155,492,352 B, main 9267789 run 42556912418): #72 adds nothing to image A (its userland is behind test-only features); the +958,464 B is unstripped kernel debug info following the same codegen swing, which Seat E's lane is fixing. Before that, raised from 154,572,800 (153,524,224 B on 2026-10-31): #14's power menu (neo-init power-menu) and power-cap kernel, +1,751,040 B over main 0ecb5b11's 152,956,928 B."
