# SPDX-License-Identifier: MPL-2.0
#
# L7.2 size budgets: subtraction as a gate.
#
# `cargo xtask size-budget` (CI product-build) measures image A and fails when
# a measured size is over its ceiling. The ceilings are the measured value at
# the commit that introduced this file plus a small margin; the margin is the
# noise allowance, not a second budget.
#
# Raising a ceiling is allowed, in the SAME PR that grows the image, and the
# `reason` must say what grew and why it pays for itself.

[kernel_text]
# Image A's kernel ELF `.text` section (the shipped code, opt-level 3,
# ub-checks off). Grows when a feature adds code; the budget makes that growth
# visible and deliberate rather than a silent drift.
ceiling_bytes = 1516687
reason = "image A kernel .text: 1,483,919 B measured 2026-10-31 + 32 KiB for codegen/toolchain noise."

[iso]
# The model-less image A ISO: the product kernel plus the shipped desktop
# userland, licences and the Limine boot payload. The pinned Qwen2.5-0.5B model
# (485,489,152 B) and vocab (7,990,862 B) are staged from out-of-git files whose
# sizes the kernel pins at boot, so they cannot drift and are not in this
# budget. Grows when the kernel, userland or staged licences grow.
ceiling_bytes = 156463104
reason = "image A ISO (model-less): 155,414,528 B measured 2026-11-08 on main 0ecb5b11 + 1 MiB for ISO metadata/alignment. Raised from 154,572,800 (153,524,224 B on 2026-10-31): +1,890,304 B (+1.2%) from main's merges since 76a1f03f (37 userland commits, not attributed one by one; among them the time-zone table, the WM client table, Arthur's clock answers, the shared keymap and the boot-time summary)."
