# SPDX-License-Identifier: MPL-2.0
[package]
name = "neoplutarch-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Limine bootloader protocol bindings.
# Pinned to 0.6: 0.2 / 0.4.0 are yanked, and the API was significantly
# rewritten between 0.5 and 0.6. Our main.rs targets the 0.6 surface:
# limine::request::{FramebufferRequest, RequestsStartMarker, RequestsEndMarker}
# plus limine::BaseRevision.
limine = "0.6"

# Spinlocks (no_std synchronization primitives)
spin = "0.9"

# Volatile memory access for MMIO
volatile = "0.5"

# x86_64-specific structures: GDT, IDT, paging, port I/O
x86_64 = "0.15"

# UART driver for the 16550 serial port (kernel debug output)
uart_16550 = "0.3"

# Logging facade
log = "0.4"
# L3a-2: rafalh/rust-fatfs, vendored (MIT; third_party/fatfs/VENDORED.md), for
# FAT12/16/32 read-only mounts behind `fat-fs`. no_std: alloc + LFN + Unicode
# case folding; no `std`, no `chrono` (a read-only mount stamps nothing).
fatfs = { path = "../third_party/fatfs", default-features = false, features = ["alloc", "lfn", "unicode"], optional = true }

# Heap allocator backing the kernel's `#[global_allocator]`. Phase 1.1 wires
# it up against a 4 MiB virtual range we map ourselves.
linked_list_allocator = "0.10"

# NeoFS v1 checksums/content hashes. BUILD-2 uses this in no_std mode for
# read-only mount validation.
blake3 = { version = "1.8.2", default-features = false }

# Phase 4 BUILD-1a: link-layer TCP/IP substrate. Keep default features off;
# smoltcp 0.13.1 also requires one protocol and socket family to compile.
smoltcp = { version = "0.13", default-features = false, features = ["medium-ethernet", "proto-ipv6", "socket-raw"] }

# Phase 4 BUILD-5c: kTLS record protection delegates AEAD to audited crypto.
chacha20poly1305 = { version = "0.10", default-features = false }

# Phase 10.1 BUILD-10.1: the kernel CSPRNG core — ChaCha20 DRBG + SHA-256 seed-mix.
# The bare chacha20 crate (not the AEAD combiner) for the DRBG keystream.
# Reuses the shared sha2 dep (same as wifi) — no rename, no collision.
# Both no_std, default-features = false, optional.
chacha20 = { version = "0.9", default-features = false, optional = true }

# Phase 7.5 BUILD-W0: WPA2/3 supplicant crypto. The kTLS RustCrypto-reuse
# precedent (never hand-roll AES/SHA/HMAC/ECC — Article 15.7). All no_std,
# default-off; pulled only by the `wifi` feature so a non-WiFi kernel is
# bit-for-bit today.
aes = { version = "0.8", default-features = false, optional = true }
ccm = { version = "0.5", default-features = false, optional = true, features = ["alloc"] }
cmac = { version = "0.7", default-features = false, optional = true }
sha1 = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
# p256: WPA3 SAE (BUILD-W0b) needs the field element exposed (`expose-field`) and
# the RFC 9380 SSWU hash-to-element map (`hash2curve`), on top of `arithmetic`.
p256 = { version = "0.13", default-features = false, optional = true, features = ["arithmetic", "hash2curve", "expose-field"] }
# HKDF-Extract/Expand for the SAE H2E PT derivation (BUILD-W0b). RustCrypto, no_std.
hkdf = { version = "0.12", default-features = false, optional = true }

[features]
default = ["kernel-diagnostic", "accel-sim", "inference-preemptible", "user-copy-fixup", "neofs-cache-index"]
# A syscall's copy to or from user memory survives a fault on the user page
# (unmapped, read-only, or unmapped by another thread mid-copy) and returns
# EFAULT: the page-fault shim recognises the copy's one faulting instruction
# by RIP (`arch::x86_64::user_copy`). Off: the shim doesn't look, and the
# fault halts the kernel, as before.
user-copy-fixup = []
kernel-diagnostic = []
# `cargo xtask size-budget --stability` only: one behaviour-free call in
# `_kernel_start` (a `black_box` of a 3-line function), the smallest change
# the size budget must see as almost nothing. Never in an image.
size-budget-probe = []
accel-sim = []
virtio-accel = []
accel-intel = []
boot-neofs = []
# File-capability unification (I-15): brings `Handle::File` into the CapRights
# derivation/grant graph (derivable/attenuable/grantable/inheritable, with
# FileRights subset-checking). OFF by default ⇒ `Handle::File::rights()` returns
# `(0,0)`, `with_cap` ignores the requested rights, and `sys_open` adds no meta
# bits — the kernel is bit-for-bit pre-unification (the Rule-1 kill-switch, ISC-6).
file-caps = []
# OT-66 K1a (OT-61 C2.1a): capability-rooted open. The root form of SYS_OPEN
# (and SYS_MODEL_LOAD) resolves only through a RootDirCap the caller holds:
# an ordinary directory file handle on "/", minted once for init. EPERM
# without one; the requested rights must lie within the cap's; a file opened
# through it is its child, so revoking the cap reaches it. Spawn inheritance
# admits a directory cap carrying GRANT. Implies file-caps (derive, grant and
# revoke of file handles). OFF by default: the root form stays open to all,
# bit-for-bit the previous layer.
cap-rooted-open = ["file-caps"]
# OT-66 L1 (Dexter #186 item 4): the sign-in record's store. Every root-form
# path under a mount's `.system/` (the credential and account files) opens,
# and loads as a model, only for a holder of the `SystemStore` authority,
# which the kernel mints into the session root (neo-init) alone and which
# can't be derived, granted or inherited. EPERM for every other process,
# whatever the root form allows them elsewhere. Off: no handle kind, no check.
system-store = []
# Dexter #187 item 3a (J.c., option A): mounting and unmounting need the
# `MountAuthority`, which the kernel mints into the session root (neo-init)
# alone and which can't be derived, granted or inherited. SYS_MOUNT and
# SYS_UMOUNT are EPERM for every other process, whatever MOUNT right a
# directory handle carries, and a plain open no longer carries MOUNT.
# Off: no handle kind, no check.
mount-authority = []
# OT-61 C2.2 (A2, I-18): per-process memory accounts. A budgeted spawn
# (SYS_SPAWN_BUDGETED) gets its own account nested under the spawner's; every
# frame its Pmap owns and every Atrium buffer it creates is charged before it
# is allocated, and a charge over any limit up the chain is a local ENOMEM. A
# budgeted process may not allocate tensor storage. Default-off: the kernel is
# unchanged without it.
mem-quota = []
# OT-61 C2.2b (I-19): a per-account budget for kernel-heap objects (handles,
# spawns, threads), on the mem-quota account tree. Off: no field, no charge.
obj-quota = ["mem-quota"]
# Phase 7.5 CB-3 (7.5-D identity): the runtime InterfaceId registry — runtime
# eth0/wlan0 names + hotplug link-state replacing the baked &'static str literals,
# multi-interface RFC-6724 select_source replacing get_device(0), and the
# /net/if/<name> Handle::File capability path. OFF by default ⇒ the net stack
# collapses to the proven 7.5-C2 single-device behavior (index semantics, ambient
# get_device(0), the &'static str names) bit-for-bit (the Rule-1 kill-switch, ISC-5a).
interface-identity = []
# Phase 7.5 CB-3 (ISC-5b): a SECOND, separately-default-off sub-switch (depends on
# interface-identity) gating whether network egress *requires* presenting an
# interface capability. OFF by default ⇒ ambient access exactly as today, so
# identity/naming lands and bakes before access is ever gated.
interface-caps = ["interface-identity"]
# Product eth0-at-boot flow. Default-off kill-switch: when disabled, no USB
# host path or boot DHCP code is compiled into production boot. When enabled,
# boot enumerates USB, binds CDC-ECM/AX88179 through the existing class driver,
# names the Ethernet-class interface through ADR-068 (`eth0` on the product
# bare-metal path), and runs bounded DHCPv4.
boot-eth0 = ["usb-host", "interface-identity"]
# Explicit product feature-set, rather than silently widening `default`. It
# composes the default posture with the independent boot NeoFS and Ethernet
# flows, so neither product capability displaces the other.
product = [
    "kernel-diagnostic",
    "accel-sim",
    "inference-preemptible",
    "boot-neofs",
    # OT-92: the boot NeoFS mount's cache stays bounded.
    "neofs-cache-evict",
    # The cache finds a block through an index, not a scan.
    "neofs-cache-index",
    "boot-eth0",
]
# Desktop stage S1: a production (non-neo-test) session boot. neo-init stays
# resident as the trusted userland compositor/WM owner instead of halting after
# the splash: the kernel arms the Atrium runtime switch, hands neo-init the
# scarce GpuSubmit scanout authority, and exposes the output size to that
# authority holder only (SYS_FB_OUTPUT_QUERY). Default-off kill-switch: when
# disabled none of this is compiled and every build is bit-for-bit today's
# (the Atrium runtime switch stays scenario-only, neo-init is not handed a
# scanout cap, and the boot path still runs-to-exit then draws the splash).
desktop-session = ["atrium-input-routing", "usb-hid-mouse", "ps2-keyboard"]
# The i8042 (PS/2) keyboard: a laptop's built-in keyboard (the Zenbook's
# EC-emulated `ATK3001`). Probes ports 0x60/0x64 (the FADT "8042 present" bit
# is logged, not trusted), routes IRQ1 through the I/O APIC (MADT override
# honoured) and decodes set 1 (translated) into the USB HID keyboard's key
# events, delivered through the same focus path. Coexists with USB HID. On in
# `desktop-session`; off ⇒ not compiled, bit-for-bit today.
ps2-keyboard = []
# Software key auto-repeat (`atrium/key_repeat_logic.rs`) for every keyboard
# (i8042 and USB HID): after 500 ms held, 30 repeats a second, sent as the
# key's press with flag bit 1 (`KEY_REPEAT`). Ends on release, another key, a
# modifier change, a focus move or 20 s; modifiers, locks, Pause, Print
# Screen, Escape and Enter never repeat. Run by the pumps, never the ISR. A
# repeat never queues behind an unread repeat. The i8042 counts the
# keyboard's own typematic makes (`typematic=`), which it drops as before.
# Enabled in the product ISO (xtask); off => not compiled, bit-for-bit today.
key-autorepeat = ["atrium-input-routing"]
# The Zenbook S14 touchpad, rung 1: HID over I2C on Intel Serial-IO I2C5, the
# touchpad's mouse collection fed to the USB mouse's pointer path
# (Plans/DISPATCH-2026-10-23-zenbook-i2c-hid-touchpad.md). Matched by a
# platform quirk entry (the DSDT's own description of the touchpad, plus PCI
# 00:19.1 = 8086:E351); any other machine prints one "no match" line and is
# never touched. PIO only (the LPSS DMA engine stays in reset), the level
# GSI masked by the ISR and drained by a kernel thread. Off => not compiled,
# bit-for-bit today.
i2c-hid-touchpad = []
# The touchpad controller's BAR0 when firmware left it unassigned (image A4:
# `bar0=0x00000004`, a 64-bit BAR at 0): size it, pick the lowest naturally
# aligned slot at or above the lowest firmware 64-bit BAR (and >= 4 GiB) that
# clears every function's BARs (each excluded up to its alignment, so never
# undersized), every bridge window and every memory-map entry, read the slot
# with nothing claimed (all-ones or rejected, a few tries), then program it.
# PIO only, bus mastering off. Off => the driver stops at `bar0 unassigned by
# firmware`, as before.
i2c-hid-bar-assign = ["i2c-hid-touchpad"]
# Zenbook lane: mirror every kernel log line onto the framebuffer from early
# boot until the desktop session takes it (a photo of the screen is the boot
# log on a target with no serial port). Enabled by `xtask iso --with-model`
# and bare-metal bundles; feature-off ⇒ not compiled (byte-identical).
fb-progress-console = []
# L7.1: the boot-time numbers. The kernel stamps the TSC at entry and at
# desktop start, reads the firmware's boot timestamps (FPDT/FBPT), prints
# one `[ boot ] time:` line as the boot console's last, and serves them
# through `SYS_BOOT_TIMES` (0x55). The rate comes from the LAPIC timer's
# calibration. Off: none of it is compiled, `SYS_BOOT_TIMES` is ENOSYS.
boot-time = ["lapic-timer"]
# Zenbook bring-up evidence holds (kill-switch): before the desktop takes the
# framebuffer, wait 5 s for a USB keyboard or mouse to bind and hold the USB
# summary up to 30 s (or run a 6 s input check), and run the touchpad's 6 s
# check and its 30 s hold, so a photo of the boot console can be taken. OFF
# (image A): the same summary lines are printed (serial, and the boot console
# until the desktop replaces it) and the boot does not wait. Image A installs no
# log sink and the Zenbook has no serial port, so there the lines are not kept:
# a bring-up run that needs them turns this on. ON restores the holds exactly.
boot-evidence-holds = []
# CP-68 kill-switch: keep the pre-x2APIC Limine MP request (no x2APIC flag).
# Limine then disables x2APIC before handoff wherever firmware allows it, and
# every APIC access is xAPIC MMIO, bit-for-bit today's path. On firmware with
# x2APIC locked on, Limine refuses to boot this build ("Kernel does not
# support x2APIC, but machine requires it"), exactly as before CP-68.
xapic-only = []
# Zenbook lane (NOTE §4a, CP-69): the BSP's kernel tick from the local APIC
# timer (TSC-deadline, else periodic), calibrated from CPUID 0x15 or against
# the HPET / ACPI PM timer (the PIT only cross-checks; CPUID 0x16 is never
# used), for platforms whose 8254 is gated or whose 8259 route is gone. Same
# vector (32) and timer entry; only the EOI differs. Falls back to a verified
# PIT/PIC tick when nothing calibrates, else halts with NO TICK SOURCE.
# Enabled by `xtask iso --with-model` and bare-metal bundles; feature off ⇒
# the PIT/PIC tick, unchanged.
lapic-timer = []
# The shipping desktop feature-set: `product` plus the live session and the
# substrates Arthur needs to answer when a model is provisioned. Composed here
# rather than silently widening `product` (that is a PM/PL call).
desktop = [
    "product",
    "desktop-session",
    "usb-hotplug",
    "rtc-epoch",
    "rtc-offset",
    # A3p (OT-88 THINK §2.3 item 9): SYS_WAIT_ANY, so the WM's loop parks
    # (its `desktop-park`, xtask's default for the intro WM) in image A and
    # every desktop kernel. Without the WM's `desktop-park` nothing calls it.
    "wait-multiplex",
    # F10 (J.c., 2026-11-02): held keys repeat, in every desktop kernel the
    # gate boots as in the product image.
    "key-autorepeat",
    "kernel-sysstat",
    "phase9-real-quant",
    "threaded-matmul",
    "phase9-avx2-matmul",
    "forward-perf",
]
# F11 S4 (setup-menu THINK §3.3): SYS_NET_IF_STATUS, a read-only snapshot of
# the default network interface (link, driver, MAC, IPv4, the DHCP lease) for
# the setup menu's Network page. Off => the number is ENOSYS and nothing is
# compiled; the page then says "Network status is unavailable". Not in
# `desktop` yet: the setup menu isn't in the product image; its gate kernel
# (`neo-test-setup-net-boot`) composes it.
net-info = []
# OT-61 NetDialCap: require an explicit, scope-matching kernel capability for
# SYS_NET_DIAL. OFF by default leaves the original three-argument ambient dial
# implementation compiled unchanged (the Rule-1 kill-switch).
net-dial-cap = []
# OT-61 rung 5b: a NetDial cap without the NON_PUBLIC right reaches only public
# addresses (checked after the kernel's own resolution). Root caps carry the
# right, so every existing holder dials as with plain net-dial-cap.
net-dial-public-only = ["net-dial-cap"]
ai-generate = []
# OT-40: re-enable interrupts around long in-kernel inference compute windows.
# OFF restores the previous syscall-body IF=0 behavior for the kill switch.
inference-preemptible = ["xsave-fpu"]
gguf = []
# Phase 9 BUILD-9.1: scalar Q4_K x Q8_K quantized matmul helpers. OFF by
# default; 9.2 wires the feature into the forward path after the standalone KATs.
phase9-quantized-matmul = []
# Phase 9 BUILD-9.3: host-gated AVX2 Q4_K x Q8_K dot. OFF by default and
# depends on the scalar/helper surface; runtime CPUID/XCR0 still gates execution.
phase9-avx2-matmul = ["phase9-quantized-matmul"]
# Lever 1 kill-switch (Plans/NOTE-2026-10-25-arthur-non-matvec-cost.md): `soft_f32` add/sub/mul
# use SSE by default, byte-identical to the integer path (host oracles in tools/ai-ops-tests).
# ON compiles the integer path only, bit-for-bit the previous layer.
soft-f32-only = []
# OT-28 F1: correctness-first mixed-quant forward path. When ON, quantized
# Qwen2 weight tensors (q4_K/q5_0/q6_K/q8_0) stream through the landed
# dequant-to-f32 primitives and then the f32 matmul. OFF keeps the existing
# q4_K native/f32 fixture behavior.
phase9-real-quant = ["gguf", "ai-generate"]
# OT-28 F2: derive Qwen2 config values from a loaded `.neom` model's tensor
# inventory plus v2 header config metadata. OFF keeps the hardcoded 0.5B
# fixture config bit-for-bit.
phase9-data-driven-config = []
# OT-34: thread the forward matmul across cores. Deterministic column-partition
# fork-join (output columns split across CPUs; each core runs the identical F4
# kernel over a disjoint range, so the result is byte-identical regardless of
# core count). Implies the real-quant forward path (the only matmul it threads).
# OFF (default) ⇒ the forward is single-threaded, bit-for-bit the pre-OT-34 path;
# ON with `thread_count == 1` (the default even when enabled) is also
# single-threaded — the kill-switch is proven at both layers.
threaded-matmul = ["phase9-real-quant"]
# Lever 2 (Plans/NOTE-2026-10-25-arthur-lever2-design.md): fork the per-element
# soft work across the `threaded-matmul` executor: SwiGLU by element range, and
# the cached decode step's attention by q-head range (past a work threshold). Every
# partition writes a disjoint output range and no reduction crosses one, so the
# bytes are the single-threaded path's at any core count (the
# `threaded_matmul_parity` scenario checks it, with its perturbation control).
# OFF => the previous byte-view SwiGLU, bit-for-bit; ON with `thread_count == 1`
# runs the same arithmetic on one core.
par-elementwise = ["threaded-matmul"]
# Arthur perf lane: the TSC forward-latency instrumentation (kernel/src/ai/
# forward_perf.rs). Correctness-neutral (read_tsc is a pure register read), so a
# build with it is byte-identical to one without; the showcase pulls it in to
# replace the Milestone-A ms=0 with an honest per-forward-ms / tok_per_s read.
forward-perf = []
# Arthur answer-latency lane: per-generation breakdown of where a
# `sys_generate` spends its time (prefill vs decode, the layer stack vs the
# lm_head, quantized matvec vs the rest, the par_matmul barrier and steals),
# the timeline (the surface commit before it, the WM's presents during and
# after it), and per CPU the partitions run and the effective clock from
# APERF/MPERF, plus the generating CPU's HWP state; lines 4-6 of the
# freeze-watchdog overlay. Relaxed TSC/MSR reads only; logits unchanged. In
# image A's kernel (PRODUCT_IMAGE_KERNEL_FEATURES, round 2); off => not
# compiled, bit-for-bit today.
# A9-B: greedy decoding kept out of degenerate loops, deterministically: a
# repetition penalty over the last 64 generated tokens (repetition_logic::
# DECODE_PENALTY, 1.0 until Qwen2.5's published value is read) and a loop
# stop (a reply whose last 16 tokens repeat an earlier run ends before the
# repeat). Off = today's tokens exactly (the kill-switch).
decode-repetition-guard = []
prefill-perf = ["forward-perf", "threaded-matmul"]
# Arthur latency round 2: enable HWP (IA32_PM_ENABLE) on every CPU that has
# it and request its full range with a performance energy preference
# (IA32_HWP_REQUEST), from each CPU's `enable_sse`. A CPU without HWP is left
# alone. In image A's kernel (PRODUCT_IMAGE_KERNEL_FEATURES) since the
# Zenbook A/B of 2026-10-25 (A6 vs A6-hwp: CPU 0 at 1071 vs 3287 MHz, "What's
# 2+2?" in 57 s vs about 18 s); off => no power MSR is ever written.
hwp-performance = []
# Arthur latency round 2: the par_matmul steal grace in TSC time (50 us from
# the job's publish) instead of 2M spins, whose length depends on the CPU's
# PAUSE latency. Needs the calibrated TSC of `lapic-timer`. Off => the spin
# grace, bit-for-bit.
matmul-steal-grace-time = ["threaded-matmul", "lapic-timer"]
# OT-16 B1: the data-driven forward-graph walker. OFF (default) = the hardcoded
# per-layer forward loop, bit-for-bit (kill-switch 1). ON = walk the layer-kind
# schedule from the `.neom` (explicit v3, or synthesized n x Qwen2AttentionFFN
# for v1/v2); byte-identical for a Qwen2 schedule (kill-switch 2). B2b executes
# GatedDeltaNetLinear through the GDN runner when a GDN schedule entry appears.
ot16-graph-walker = []
# OT-23: kernel FPU context images upgraded from FXSAVE to CPUID-sized
# XSAVE(x87|SSE|AVX). Required by default OT-40 preemptible inference; still
# disabled when that feature is disabled via the kill-switch/no-default path.
xsave-fpu = []
# Phase 7.5 BUILD-V: Intel VT-d / IOMMU (the I-14(c2) hardware DMA fence). When
# OFF (the default), the ACPI/DMAR parse and the `iommu` driver are not compiled
# at all — the kernel is bit-for-bit pre-VT-d (the Rule-1 kill-switch, ISC-6).
vtd = []
# Phase 7.5 BUILD-W0/W1: the MT7601U WiFi arc. W0 = the host-tier WPA2/3
# supplicant crypto library (PBKDF2/PRF/PTK-GTK, EAPOL-Key MIC, AES-CCMP,
# PMKID, SAE). OFF by default ⇒ the crypto deps aren't pulled and the kernel is
# bit-for-bit today (the kill-switch). W1 (the driver) extends this feature.
# W2 (OT-2): `wifi` now pulls `kernel-rng` so the 4-way handshake's SNonce is a
# CSPRNG draw (`crate::rng::fill_random`), not a counter — the difference between
# "associates" and "is a security boundary". Default-off ⇒ still bit-for-bit today.
wifi = ["dep:aes", "dep:ccm", "dep:cmac", "dep:sha1", "dep:sha2", "dep:hmac", "dep:pbkdf2", "dep:p256", "dep:hkdf", "kernel-rng"]
# Phase 7.5 BUILD-W1: the MT7601U USB SoftMAC driver (scan). Extends the WiFi
# arc umbrella (`wifi`) and rides the 7.5-A/B USB core (`usb-host`). OFF by
# default ⇒ the driver, the per-channel PHY tables, and the embedded firmware
# blob are not compiled and the kernel is bit-for-bit today (the Rule-1
# kill-switch, ISC-6). W2 (the on-air supplicant) will extend this feature.
mt7601u = ["wifi", "usb-host"]
# Phase 7.5 CB-5a: the WPA3-SAE on-air connect path (SAE dragonfly + full
# 802.11w PMF + SAE-PMK 4-way + group-key handshake), built as the
# `net::wifi::sae_connect` orchestrator over an abstract TX/RX seam. Extends the
# WiFi arc (`wifi`); the SAE/BIP crypto primitives already ride `wifi`'s deps.
# OFF by default ⇒ `sae_connect` is not compiled and the driver's associate()
# path is bit-for-bit CB-2/WPA2 today (the Rule-1 kill-switch, ISC-5).
wpa3-sae = ["wifi"]
# The Realtek RTL8125 2.5GbE driver, rung 1 (bind, XID, MAC, PHY link,
# descriptor rings, NetDevice -> boot DHCP + gateway ARP). Polled. Every DMA
# buffer is in the fenced arena; bus mastering is granted only when the
# device is in the VT-d fence domain or `rtl8125-dma-without-iommu` is on.
# Off (the kill-switch) => not compiled, bit-for-bit today.
rtl8125 = []
# The explicit opt-in to let the RTL8125 bus-master on a host with no
# supported IOMMU (AMD-Vi is not driven; the PL's main PC is AMD): arena-only
# containment (I-14(c1)), no (c2). Never implied by another feature. The
# product image (`xtask iso --with-model`, PRODUCT_IMAGE_KERNEL_FEATURES)
# carries it with `rtl8125`, by PL decision (J.c., 2026-10-24); a device in
# the VT-d fence domain still takes the IOMMU path (`containment`).
rtl8125-dma-without-iommu = ["rtl8125"]
# When enabled, kernel writes verbose diagnostics to serial.
# Off in release builds.
verbose-boot = []
serial-stdin = []
# Phase 10.1 BUILD-10.1: the kernel CSPRNG core (entropy + ChaCha20 DRBG + KATs).
# OFF by default ⇒ chacha20/sha2 deps aren't pulled and the kernel is
# bit-for-bit today (the Rule-1 kill-switch, ISC-4). Keeping optional +
# default-off prevents dep unification with no_std userland (#243 trap).
kernel-rng = ["dep:chacha20", "dep:sha2"]
# OT-90 (THINK docs/THINK-2026-10-27-ot90-shutdown-restart.md): power-off and
# restart. P2: `acpi::power` decodes \_S5 at boot, caches the plan, and runs the
# S5 write and the reset chain, entered from the ot90_* scenarios only. OFF by
# default => no power module, no extra ACPI walk, and the kernel is bit-for-bit
# today (the kill-switch).
power-control = []
# OT-90 P3a (L1.4): a clean shutdown before the S5 write or the reset. A
# kernel thread terminates the user processes (K1), freezes and drains every
# writable NeoFS mount with a bounded, reported clean/unclean outcome (K2),
# and flushes the log (K3), then runs P2's power-off or restart. K1-K3 run in
# their own thread with a 20 s deadline on the whole: past it the shutdown
# abandons them (a disk that never completes a request) and powers off or
# restarts anyway. Off => nothing of it is compiled: P2 exactly (the
# kill-switch).
