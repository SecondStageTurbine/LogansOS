<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <title>Arthur</title>
  <!-- one open arc: the ring idea, never the OS mark's broken double ring -->
  <path d="M8.33 31.67 A16.5 16.5 0 0 1 8.33 8.33" fill="none" stroke="#a8adb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the spark: four points, concave sides -->
  <path d="M20 7 Q21.6 18.4 33 20 Q21.6 21.6 20 33 Q18.4 21.6 7 20 Q18.4 18.4 20 7 Z" fill="#ffffff" stroke="#3c8ef4" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- liveness: a small light across from the arc -->
  <circle cx="31.5" cy="8.5" r="2.5" fill="#3c8ef4"/>
</svg>
