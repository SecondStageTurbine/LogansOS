# OT-61 C2.3b: build the vendored html5ever + selectors closure for
# x86_64-unknown-neoplutarch. OT-61 C3a: and the private C/C++ runtime
# (neo-crt: musl + libc++ compiled with clang), job crt-build. OT-61 rung 4:
# upstream SWGL over neo-crt (third_party/ot61-swgl), job swgl-build.
#
# The closure's build scripts (web_atoms' atom tables) and proc macros
# (cssparser-macros, derive_more-impl, phf_macros) run at build time. J.c.'s
# decision (2026-10-29, ledger): their first build runs on the CI runners, not
# on a coder's or the PM's machine. This job is that build, and it repeats on
# every push that changes the closure, the smoke, or the std it links, so a
# change to any of them is built here before it reaches the QEMU gate (which
# builds the same smoke for its `servo_closure_smoke*` scenarios).
#
# Light: one std build plus the closure, no QEMU. Runs on the host-job runners.
name: OT-61 closure build

on:
  workflow_dispatch:
  push:
    branches: ['claude/ot61-**', main]
    paths:
      - 'third_party/ot61-browser/**'
      - 'userland/servo-closure-smoke/**'
      - 'userland/stylo-smoke/**'
      - 'userland/neo-crt/**'
      - 'userland/cxx-runtime-smoke/**'
      - 'third_party/ot61-crt/**'
      - 'userland/swgl-smoke/**'
      - 'third_party/ot61-swgl/**'
      - 'userland/mozjs-smoke/**'
      - 'third_party/ot61-mozjs/**'
      - 'userland/neoplutarch-std-overlay/**'
      - 'userland/neo-std-pal/**'
      - 'userland/x86_64-unknown-neoplutarch.json'
      - '.github/workflows/ot61-closure.yml'
      - 'scripts/ci-disk-guard.sh'
      - 'tools/xtask/**'
      - 'rust-toolchain.toml'
      - 'Dockerfile'

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

concurrency:
  group: ot61-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-build:
    name: html5ever + selectors closure (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 45

    # Isolated toolchain roots, as in ci.yml's host jobs (2026-08-11 note).
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The disk bound (Janus #214): a free-space floor before the build, a
      # budget for what it writes after, and the build dirs removed at the
      # end whatever happened (scripts/ci-disk-guard.sh). Measured: about 3
      # GiB (the closure smoke ~0.8, the overlaid std, xtask, the toolchain).
      - name: Disk floor (12 GiB free)
        run: bash scripts/ci-disk-guard.sh check 12

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      # Every crate in the closure must come from third_party/ot61-browser:
      # the lockfile may name crates.io only for neo-std-pal's existing
      # linked_list_allocator.
      - name: The closure resolves to the vendored sources only
        working-directory: userland/servo-closure-smoke
        run: |
          set -e
          registry=$(awk '/^name = /{n=$3} /^source = "registry/{print n}' Cargo.lock | tr -d '"')
          echo "from crates.io: ${registry:-none}"
          if [ "$registry" != "linked_list_allocator" ]; then
            echo "ERROR: a closure crate resolves to crates.io, not the vendored copy"
            exit 1
          fi

      - name: xtask ot61-closure-build (overlay std + closure + A4 checks)
        run: cargo run -p xtask -- ot61-closure-build

      - name: Disk budget (6 GiB written)
        run: >-
          bash scripts/ci-disk-guard.sh budget 6
          target userland/servo-closure-smoke/target userland/std-real-smoke/target
          .rustup-home .cargo-home

      - name: Remove the build dirs
        if: always()
        run: >-
          bash scripts/ci-disk-guard.sh clean
          target userland/servo-closure-smoke/target userland/std-real-smoke/target
          .rustup-home .cargo-home
  # OT-61 C2.4: upstream Stylo over the same vendored tree. Its build script
  # renders the property code from Mako templates with the host's python3
  # (J.c., 2026-10-31: allowed, with no network fetch). The Python it imports
  # is bundled in the vendored crate (stylo-0.22.0/properties/vendored_python,
  # VENDORED.md); PIP_NO_INDEX makes any pip lookup fail closed. Like the
  # closure job, the first build of this third-party build code runs here.
  stylo-build:
    name: Stylo (C2.4) over the vendored closure (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 60

    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      PIP_NO_INDEX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      - name: python3 is present
        run: |
          set -e
          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: ${RUNNER_NAME:-runner} has no python3; Stylo's build script needs it (C2.4 survey §3.7)"
            exit 1
          fi
          python3 --version

      # Every crate must come from third_party/ot61-browser: the lockfile may
      # name crates.io only for neo-std-pal's linked_list_allocator.
      - name: The Stylo closure resolves to the vendored sources only
        working-directory: userland/stylo-smoke
        run: |
          set -e
          registry=$(awk '/^name = /{n=$3} /^source = "registry/{print n}' Cargo.lock | tr -d '"')
          echo "from crates.io: ${registry:-none}"
          if [ "$registry" != "linked_list_allocator" ]; then
            echo "ERROR: a closure crate resolves to crates.io, not the vendored copy"
            exit 1
          fi

      - name: xtask ot61-closure-build --stylo (overlay std + Stylo + A4 checks)
        run: cargo run -p xtask -- ot61-closure-build --stylo

  # On the hosted runner, with clang installed in the job: the same LLVM
  # major the Dockerfile pins for the QEMU gate (NEO_CRT_CLANG_MAJOR), and the
  # job fails if apt resolves another major, so the compiler can't move
  # silently. (It used to run in the dev container on the self-hosted
  # qemu-shard runners, which the public repo doesn't have, so it never
  # started.)
  crt-build:
    name: neo-crt C/C++ runtime (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 60

    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      NEO_CRT_CLANG_MAJOR: "19"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      # The Dockerfile's pin and this one must agree.
      - name: Install clang (the Dockerfile's pinned major)
        run: |
          set -e
          grep -q "^ARG NEO_CRT_CLANG_MAJOR=${NEO_CRT_CLANG_MAJOR}\$" Dockerfile \
            || { echo "ERROR: Dockerfile pins a different NEO_CRT_CLANG_MAJOR"; exit 1; }
          if ! command -v "clang-${NEO_CRT_CLANG_MAJOR}" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "clang-${NEO_CRT_CLANG_MAJOR}"
          fi
          "clang-${NEO_CRT_CLANG_MAJOR}" --version | head -1
          test "$("clang-${NEO_CRT_CLANG_MAJOR}" -dumpversion | cut -d. -f1)" = "${NEO_CRT_CLANG_MAJOR}"
          echo "NEO_CRT_CLANG=clang-${NEO_CRT_CLANG_MAJOR}" >> "$GITHUB_ENV"

      - name: xtask ot61-crt-build (overlay std + neo-crt + smoke + A4 checks)
        run: cargo run -p xtask -- ot61-crt-build

  swgl-build:
    name: SWGL S1 smoke over neo-crt (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 45

    # Isolated toolchain roots, as in ci.yml's host jobs (2026-08-11 note).
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      NEO_CRT_CLANG_MAJOR: "19"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      # The same pinned clang as crt-build (the Dockerfile's major).
      - name: Install clang (the Dockerfile's pinned major)
        run: |
          set -e
          grep -q "^ARG NEO_CRT_CLANG_MAJOR=${NEO_CRT_CLANG_MAJOR}\$" Dockerfile \
            || { echo "ERROR: Dockerfile pins a different NEO_CRT_CLANG_MAJOR"; exit 1; }
          if ! command -v "clang-${NEO_CRT_CLANG_MAJOR}" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "clang-${NEO_CRT_CLANG_MAJOR}"
          fi
          "clang-${NEO_CRT_CLANG_MAJOR}" --version | head -1
          test "$("clang-${NEO_CRT_CLANG_MAJOR}" -dumpversion | cut -d. -f1)" = "${NEO_CRT_CLANG_MAJOR}"
          echo "NEO_CRT_CLANG=clang-${NEO_CRT_CLANG_MAJOR}" >> "$GITHUB_ENV"

      # Every SWGL closure crate comes from third_party/ot61-swgl.
      - name: The SWGL closure resolves to the vendored sources only
        working-directory: userland/swgl-smoke
        run: |
          set -e
          registry=$(awk '/^name = /{n=$3} /^source = "registry/{print n}' Cargo.lock | tr -d '"')
          echo "from crates.io: ${registry:-none}"
          if [ -n "$registry" ]; then
            echo "ERROR: a SWGL closure crate resolves to crates.io, not the vendored copy"
            exit 1
          fi

      # SWGL's build script translates WebRender's shaders (glsl-to-cxx) and
      # compiles gl.cc; this is where that third-party build code first runs.
      - name: xtask ot61-swgl-build (overlay std + neo-crt + SWGL + A4 checks)
        run: cargo run -p xtask -- ot61-swgl-build

  mozjs-build:
    name: SpiderMonkey C3c-1 smoke over neo-crt (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 75

    # Isolated toolchain roots, as in ci.yml's host jobs (2026-08-11 note).
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      NEO_CRT_CLANG_MAJOR: "19"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      # The same pinned clang as crt-build (the Dockerfile's major).
      - name: Install clang (the Dockerfile's pinned major)
        run: |
          set -e
          grep -q "^ARG NEO_CRT_CLANG_MAJOR=${NEO_CRT_CLANG_MAJOR}\$" Dockerfile \
            || { echo "ERROR: Dockerfile pins a different NEO_CRT_CLANG_MAJOR"; exit 1; }
          if ! command -v "clang-${NEO_CRT_CLANG_MAJOR}" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "clang-${NEO_CRT_CLANG_MAJOR}"
          fi
          "clang-${NEO_CRT_CLANG_MAJOR}" --version | head -1
          test "$("clang-${NEO_CRT_CLANG_MAJOR}" -dumpversion | cut -d. -f1)" = "${NEO_CRT_CLANG_MAJOR}"
          echo "NEO_CRT_CLANG=clang-${NEO_CRT_CLANG_MAJOR}" >> "$GITHUB_ENV"

      # Every closure crate comes from a vendored copy (ot61-browser, ot61-swgl,
      # ot61-mozjs) or the patched mozjs crates.
      - name: The SpiderMonkey closure resolves to the vendored sources only
        working-directory: userland/mozjs-smoke
        run: |
          set -e
          registry=$(awk '/^name = /{n=$3} /^source = "registry/{print n}' Cargo.lock | tr -d '"')
          echo "from crates.io: ${registry:-none}"
          if [ -n "$registry" ]; then
            echo "ERROR: a SpiderMonkey closure crate resolves to crates.io, not the vendored copy"
            exit 1
          fi

      # The product build (THINK 2026-11-08 §2): mozjs-sys's std-only build
      # script compiles the generator's frozen command lines through neo-cc,
      # libz-sys compiles its bundled zlib; no Python, configure, bindgen or
      # network. xtask lists the build scripts that ran and fails on any
      # outside its allowed list.
      - name: xtask ot61-closure-build --mozjs (overlay std + neo-crt + SpiderMonkey + A4 checks)
        run: cargo run -p xtask -- ot61-closure-build --mozjs
