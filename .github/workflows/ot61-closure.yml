# OT-61 C2.3b: build the vendored html5ever + selectors closure for
# x86_64-unknown-neoplutarch.
#
# The closure's build scripts (web_atoms' atom tables) and proc macros
# (cssparser-macros, derive_more-impl, phf_macros) run at build time. J.c.'s
# decision (2026-10-29, ledger): their first build runs on the CI runners, not
# on a coder's or the PM's machine. This job is that build, and it repeats on
# every push that changes the closure, the smoke, or the std it links, so a
# change to any of them is built here before it reaches the QEMU gate (which
# builds the same smoke for its `servo_closure_smoke*` scenarios).
#
# Light: one std build plus the closure, no QEMU. Runs on the host-job runners.
name: OT-61 closure build

on:
  workflow_dispatch:
  push:
    branches: ['claude/ot61-**', main]
    paths:
      - 'third_party/ot61-browser/**'
      - 'userland/servo-closure-smoke/**'
      - 'userland/neoplutarch-std-overlay/**'
      - 'userland/neo-std-pal/**'
      - 'userland/x86_64-unknown-neoplutarch.json'
      - '.github/workflows/ot61-closure.yml'
      - 'tools/xtask/**'
      - 'rust-toolchain.toml'

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

concurrency:
  group: ot61-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-build:
    name: html5ever + selectors closure (x86_64-unknown-neoplutarch)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 45

    # Isolated toolchain roots, as in ci.yml's host jobs (2026-08-11 note).
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup is present (self-hosted runners)
        run: |
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on ${RUNNER_NAME:-runner}; bootstrapping"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$RUSTUP_HOME/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-16
          components: rust-src,llvm-tools-preview
          targets: x86_64-unknown-none

      # Every crate in the closure must come from third_party/ot61-browser:
      # the lockfile may name crates.io only for neo-std-pal's existing
      # linked_list_allocator.
      - name: The closure resolves to the vendored sources only
        working-directory: userland/servo-closure-smoke
        run: |
          set -e
          registry=$(awk '/^name = /{n=$3} /^source = "registry/{print n}' Cargo.lock | tr -d '"')
          echo "from crates.io: ${registry:-none}"
          if [ "$registry" != "linked_list_allocator" ]; then
            echo "ERROR: a closure crate resolves to crates.io, not the vendored copy"
            exit 1
          fi

      - name: xtask ot61-closure-build (overlay std + closure + A4 checks)
        run: cargo run -p xtask -- ot61-closure-build
