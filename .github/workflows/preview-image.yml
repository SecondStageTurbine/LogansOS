# SPDX-License-Identifier: MPL-2.0
#
# The downloadable preview VM (Plans/DISPATCH-2026-11-01-preview-vm-image.md).
# Builds the product image the way `cargo xtask vm-image --with-model` does
# (UEFI boot disk + NeoFS data disk), packages it for Windows
# (scripts/preview/preview.py), boots the packaged zip exactly as its
# `Start LogansOS.bat` does and waits for the desktop session's ready marker,
# and only then publishes it to the rolling `preview` pre-release.
#
# GitHub-hosted runners only. Only the `publish` job holds a write token.
name: Preview VM image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the `preview` release after the boot check passes"
        type: boolean
        default: true
  # TEMPORARY (removed before the PR is ready): GitHub refuses
  # workflow_dispatch for a workflow not yet on the default branch, so the
  # branch iterates on push.
  push:
    branches: [claude/preview-vm-image]
    paths: ['.github/workflows/preview-image.yml', 'scripts/preview/**']
  schedule:
    # Daily; skipped when main has not moved since the published preview.
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: preview-image
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  # Arthur's stage-B model, pinned (B1-1, Plans/RETURN-2026-10-20-b1-1-model-import-janus.md):
  # the upstream revision, the GGUF's SHA-256 (= its LFS oid at that revision)
  # and the SHA-256 of the repository's LICENSE file at that revision.
  MODEL_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  MODEL_REV: 9217f5db79a29953eb74d5343926648285ec7e67
  MODEL_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
  MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
  MODEL_LICENSE_SHA256: 832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e
  # The firmware's licence: QEMU v10.2.3's pc-bios/edk2-licenses.txt (the
  # OVMF the dev container pins comes from that QEMU's pc-bios).
  EDK2_LICENSES_URL: https://gitlab.com/qemu-project/qemu/-/raw/v10.2.3/pc-bios/edk2-licenses.txt
  EDK2_LICENSES_SHA256: 1ddeaed2e7d2e9ecb960bdfc1b8ee45387aff70d056d985d145949af3951657c

jobs:
  decide:
    name: Has main changed since the last preview?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh release view preview --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null \
              | grep -o 'preview-sha: [0-9a-f]\{40\}' | grep -o '[0-9a-f]\{40\}' || true)
            echo "published preview: ${last:-none}; main now: ${{ github.sha }}"
            [ "$last" = "${{ github.sha }}" ] && build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build, package and boot-check
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
      CONTAINER_PATH: /workspace/.rustup-home/toolchains/nightly-2026-04-16-x86_64-unknown-linux-gnu/bin:/workspace/.cargo-home/bin:/home/neo/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare container cache directories
        run: mkdir -p .docker .home .rustup-home .cargo-home target/preview

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The CI workflow's dev-container cache (same key), so a warm cache skips
      # the QEMU 10.2.3 source build.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-gh
          key: buildx-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build dev container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: neoplutarch-dev:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-gh
          cache-to: type=local,dest=/tmp/.buildx-cache-new-gh,mode=max

      - name: Rotate buildx cache
        run: |
          rm -rf /tmp/.buildx-cache-gh
          mv /tmp/.buildx-cache-new-gh /tmp/.buildx-cache-gh

      # Restore-only: CI's cargo caches, never saved from here (the repo's
      # cache quota belongs to the gate).
      - name: Restore cargo registry, git, and target cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/.rustup-home
            ${{ github.workspace }}/.cargo-home/registry
            ${{ github.workspace }}/.cargo-home/git
            ${{ github.workspace }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-preview-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: Bootstrap pinned Rust toolchain on cache miss
        run: |
          TOOLCHAIN=nightly-2026-04-16-x86_64-unknown-linux-gnu
          if [ ! -x ".rustup-home/toolchains/${TOOLCHAIN}/bin/cargo" ]; then
            docker compose run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/home/neo \
              -e CARGO_HOME=/home/neo/.cargo \
              -e RUSTUP_HOME=/workspace/.rustup-home \
              neo \
              /home/neo/.cargo/bin/rustup toolchain install nightly-2026-04-16 \
                --profile minimal \
                --component rust-src,llvm-tools-preview,rustfmt,clippy \
                --target x86_64-unknown-none,aarch64-unknown-none
          fi

      # The model licence check, from raw bytes at the pinned revision: the
      # repository tree (LICENSE present, the GGUF's LFS oid), the LICENSE's
      # SHA-256 and text (Apache License 2.0), the model card's licence tag,
      # then the GGUF's SHA-256. Any mismatch fails the run: a model whose
      # licence or bytes are not the reviewed ones is never shipped.
      - name: Fetch Arthur's model and check its licence
        run: |
          set -euo pipefail
          d=target/preview/model; mkdir -p "$d"
          base="https://huggingface.co/${MODEL_REPO}"
          curl -fsSL --retry 5 -o "$d/tree.json" "https://huggingface.co/api/models/${MODEL_REPO}/tree/${MODEL_REV}"
          python3 - "$d/tree.json" <<'EOF'
          import json, os, sys
          tree = {e["path"]: e for e in json.load(open(sys.argv[1]))}
          assert "LICENSE" in tree, "no LICENSE at the pinned revision"
          oid = tree[os.environ["MODEL_FILE"]]["lfs"]["oid"]
          assert oid == os.environ["MODEL_SHA256"], f"LFS oid {oid} is not the pin"
          print("tree: LICENSE present; NOTICE", "present" if "NOTICE" in tree else "absent", "; GGUF oid", oid)
          EOF
          curl -fsSL --retry 5 -o "$d/LICENSE" "$base/resolve/${MODEL_REV}/LICENSE"
          echo "${MODEL_LICENSE_SHA256}  $d/LICENSE" | sha256sum -c -
          grep -q "Apache License" "$d/LICENSE"
          grep -q "Version 2.0, January 2004" "$d/LICENSE"
          curl -fsSL --retry 5 -o "$d/README.md" "$base/resolve/${MODEL_REV}/README.md"
          sed -n '1,/^---$/{p}' "$d/README.md" | head -20
          grep -qi '^license: *apache-2.0' "$d/README.md"
          curl -fSL --retry 5 -o "$d/${MODEL_FILE}" "$base/resolve/${MODEL_REV}/${MODEL_FILE}"
          echo "${MODEL_SHA256}  $d/${MODEL_FILE}" | sha256sum -c -
          ls -l "$d"

      - name: Fetch the firmware licence
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o target/preview/edk2-licenses.txt "$EDK2_LICENSES_URL"
          echo "${EDK2_LICENSES_SHA256}  target/preview/edk2-licenses.txt" | sha256sum -c -

      # Inside the dev container: the model import (neomc, B1-1's tool), the
      # image (`cargo xtask vm-image`, the product build with `--with-model`),
      # the qcow2 conversion, the package and its boot check.
      - name: Build the image, package it, boot-check the package
        run: |
          short=$(git rev-parse --short=12 HEAD)
          echo "SHORT=$short" >> "$GITHUB_ENV"
          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace/.home \
            -e CARGO_HOME=/workspace/.cargo-home \
            -e RUSTUP_HOME=/workspace/.rustup-home \
            -e PATH="${CONTAINER_PATH}" \
            -e LIMINE_DIR=/opt/limine \
            -e NEO_SMP=4 \
            -e CARGO_HTTP_MULTIPLEXING \
            -e CARGO_NET_RETRY \
            -e MODEL_FILE \
            -e MODEL_REPO \
            -e MODEL_REV \
            -e SHA="${{ github.sha }}" \
            -e REF="${{ github.ref_name }}" \
            -e SHORT="$short" \
            -e BUILD_DATE="$(date -u +%Y-%m-%d)" \
            neo \
            bash scripts/preview/build-in-container.sh

      - name: Boot-check serial log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-boot-check-serial
          path: target/preview/boot-check-serial.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: preview-package
          path: |
            target/preview/LogansOS-preview-*.zip
            target/preview/boot-check.txt
            target/preview/with-model.txt
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish the preview release
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-package
          path: pkg

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip=$(ls pkg/LogansOS-preview-*.zip)
          name=$(basename "$zip")
          bytes=$(stat -c %s "$zip")
          mib=$(( (bytes + 1048575) / 1048576 ))
          read -r verdict secs < pkg/boot-check.txt
          model=$(cat pkg/with-model.txt)
          prev_sha=$(gh release view preview --repo "$REPO" --json body --jq .body 2>/dev/null \
            | grep -o 'preview-sha: [0-9a-f]\{40\}' | grep -o '[0-9a-f]\{40\}' || true)
          prev_at=$(gh release view preview --repo "$REPO" --json publishedAt --jq .publishedAt 2>/dev/null || true)
          {
            echo "**LogansOS preview: a ready-to-boot virtual machine for Windows.**"
            echo
            echo "Built from \`${REF}\` @ \`${SHA:0:12}\` on $(date -u +%Y-%m-%d) (UTC)."
            echo
            echo "**Download \`${name}\`** (${mib} MiB), unzip it, and follow \`README.txt\` inside:"
            echo "install QEMU once from qemu.org, then double-click \`Start LogansOS.bat\`."
            echo "The longer guide is [docs/HOWTO-try-logansos-in-a-vm.md](https://github.com/${REPO}/blob/main/docs/HOWTO-try-logansos-in-a-vm.md)."
            echo
            if [ "$model" = yes ]; then
              echo "Arthur's model is included: Qwen2.5-0.5B-Instruct (Apache-2.0), pinned at \`${MODEL_REPO}@${MODEL_REV:0:12}\`; licence and NOTICE in \`licenses/\`."
            else
              echo "Arthur's model is **not** included in this build: he answers that he has no model."
            fi
            echo
            echo "Boot check: ${verdict}. The packaged disks booted under QEMU (TCG, the same options as the .bat) and reached the first-boot screen in ${secs} s."
            echo
            if [ -n "$prev_at" ]; then
              echo "### What's in this build since the previous preview (\`${prev_sha:0:12}\`)"
              echo
              gh pr list --repo "$REPO" --state merged --base main --limit 100 \
                --search "merged:>=${prev_at}" --json number,title \
                --jq '.[] | "- #\(.number) \(.title)"' > prs.txt || true
              if [ -s prs.txt ]; then cat prs.txt; else echo "- No pull requests merged since then."; fi
            else
              echo "This is the first preview."
            fi
            echo
            echo "<!-- preview-sha: ${SHA} -->"
          } > notes.md
          cat notes.md
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Replace the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="LogansOS preview (${SHA:0:12})"
          if gh release view preview --repo "$REPO" > /dev/null 2>&1; then
            gh release upload preview "$ZIP" --repo "$REPO" --clobber
            keep=$(basename "$ZIP")
            gh release view preview --repo "$REPO" --json assets --jq '.assets[].name' \
              | while read -r asset; do
                  [ "$asset" = "$keep" ] || gh release delete-asset preview "$asset" --repo "$REPO" -y
                done
            gh api -X PATCH "repos/${REPO}/git/refs/tags/preview" -f sha="$SHA" -F force=true > /dev/null
            gh release edit preview --repo "$REPO" --title "$title" --notes-file notes.md --prerelease
          else
            gh release create preview "$ZIP" --repo "$REPO" --target "$SHA" \
              --title "$title" --notes-file notes.md --prerelease
          fi
          gh release view preview --repo "$REPO" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
