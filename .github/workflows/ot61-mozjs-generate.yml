# OT-61 C3c-1: the SpiderMonkey generator (build option (c), the PM's decision
# on #10, 2026-11-08). It runs upstream's `configure` over the vendored
# `third_party/ot61-mozjs` with the network off, and reports the files the
# product build will compile from: the unified source files, `js-confdefs.h`
# and the source lists. Third-party build code runs here, on the CI runners,
# never on a seat's machine (J.c., 2026-10-29).
#
# Step 1 (this file): a probe. `configure` runs for the C3c-1 options on the
# runner's own Linux target, so the vendored Python and build machinery are
# shown to work offline, and the job log lists what came out (artifacts are
# also uploaded). Our target (`x86_64-unknown-neoplutarch`, THINK trap T6) and
# the commit-and-diff check come next, in the same job.
name: OT-61 SpiderMonkey generator

on:
  workflow_dispatch:
  push:
    branches: ['claude/ot61-**']
    paths:
      - 'third_party/ot61-mozjs/**'
      - '.github/workflows/ot61-mozjs-generate.yml'

concurrency:
  group: ot61-mozjs-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: SpiderMonkey configure, network off (C3c-1 probe)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A copy, so vendor/ stays exactly upstream's; our patches go on the copy.
      - name: Copy the vendored tree and apply our patches
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mozjs"
          rm -rf "$src"
          cp -a third_party/ot61-mozjs/vendor/mozjs-138c9470 "$src"
          for p in third_party/ot61-mozjs/patches/*.patch; do
            echo "applying $p"
            git -C "$src" apply --verbose "$GITHUB_WORKSPACE/$p"
          done
          echo "MOZJS_SRC=$src" >> "$GITHUB_ENV"

      - name: Tools present
        run: |
          set -e
          python3 --version
          (command -v clang && clang --version | head -1) || echo "no clang on PATH"
          (command -v unshare && unshare --version) || echo "no unshare"
          (command -v ld.lld && ld.lld --version) || echo "no ld.lld"

      # Trap T7/T8: no download, no pip. `unshare -n` gives configure a network
      # namespace with no interfaces; any fetch fails the step.
      - name: configure (C3c-1 options, network off)
        run: |
          set -uo pipefail
          obj="$RUNNER_TEMP/obj"
          rm -rf "$obj" && mkdir -p "$obj"
          cd "$obj"
          sudo unshare -n -- sudo -u "$(id -un)" env \
            PATH="$PATH" HOME="$HOME" MOZBUILD_STATE_PATH="$RUNNER_TEMP/mozbuild" \
            python3 "$MOZJS_SRC/mozjs-sys/mozjs/configure.py" \
              --enable-project=js \
              --disable-jit \
              --without-intl-api \
              --disable-jemalloc \
              --disable-js-shell \
              --disable-export-js \
              --disable-shared-memory \
              --disable-wasm-moz-intgemm \
              --disable-shared-js \
              --disable-tests \
              --disable-debug \
              --enable-optimize \
              2>&1 | tee "$RUNNER_TEMP/configure.log"
          rc=${PIPESTATUS[0]}
          echo "configure exit: $rc"
          echo "MOZJS_OBJ=$obj" >> "$GITHUB_ENV"
          exit "$rc"

      # `js-confdefs.h` and the other generated headers come from the build's
      # `export` tier, not from configure. Still network off, still no compile
      # of engine code: `export` only writes headers and source lists.
      - name: make export (network off)
        run: |
          set -uo pipefail
          obj="$RUNNER_TEMP/obj"
          touch "$RUNNER_TEMP/before-export"
          sudo unshare -n -- sudo -u "$(id -un)" env \
            PATH="$PATH" HOME="$HOME" MOZBUILD_STATE_PATH="$RUNNER_TEMP/mozbuild" \
            sh -c 'make -C "$1" -j"$(nproc)" pre-export && make -C "$1" -j"$(nproc)" export' sh "$obj" \
              2>&1 | tee "$RUNNER_TEMP/export.log"
          rc=${PIPESTATUS[0]}
          echo "export exit: $rc"
          echo "== files the export wrote"
          find "$obj" -type f -newer "$RUNNER_TEMP/before-export" \
            ! -name '*.pp' ! -name '*.track' ! -name '*.stub' | sed "s|^$obj/||" | sort \
            | tee "$RUNNER_TEMP/export-files.txt"
          echo "== count: $(wc -l < "$RUNNER_TEMP/export-files.txt")"
          exit "$rc"

      # Trap T6: our own target. Patch 0002 teaches configure the triple; the
      # compiler is generator/neo-cc (neo-crt's compile line over its headers).
      - name: configure + export for x86_64-unknown-neoplutarch (network off)
        if: always()
        run: |
          set -uo pipefail
          obj="$RUNNER_TEMP/obj-neo"
          rm -rf "$obj" && mkdir -p "$obj"
          cd "$obj"
          gen="$GITHUB_WORKSPACE/third_party/ot61-mozjs/generator"
          run() {
            sudo unshare -n -- sudo -u "$(id -un)" env \
              PATH="$PATH" HOME="$HOME" MOZBUILD_STATE_PATH="$RUNNER_TEMP/mozbuild" \
              NEO_REPO="$GITHUB_WORKSPACE" NEO_CLANG=clang \
              CC="$gen/neo-cc" CXX="$gen/neo-c++" HOST_CC=clang HOST_CXX=clang++ \
              "$@"
          }
          run python3 "$MOZJS_SRC/mozjs-sys/mozjs/configure.py" \
              --target=x86_64-unknown-neoplutarch \
              --enable-project=js \
              --disable-jit \
              --without-intl-api \
              --disable-jemalloc \
              --disable-js-shell \
              --disable-export-js \
              --disable-shared-memory \
              --disable-wasm-moz-intgemm \
              --disable-shared-js \
              --disable-tests \
              --disable-debug \
              --enable-optimize \
              2>&1 | tee "$RUNNER_TEMP/configure-neo.log"
          rc=${PIPESTATUS[0]}
          echo "configure (neoplutarch) exit: $rc"
          [ "$rc" = 0 ] || { tail -40 "$RUNNER_TEMP/configure-neo.log"; exit "$rc"; }
          # pre-export runs install-manifests, which fills dist/include.
          run sh -c 'make -C "$1" -j"$(nproc)" pre-export && make -C "$1" -j"$(nproc)" export' sh "$obj" \
            2>&1 | tee "$RUNNER_TEMP/export-neo.log"
          rc=${PIPESTATUS[0]}
          echo "export (neoplutarch) exit: $rc"
          echo "== js-confdefs.h (neoplutarch)"; cat "$obj/js/src/js-confdefs.h"
          echo "== unified file count: $(find "$obj" -name 'Unified_*.cpp' | wc -l)"
          echo "== host vs neoplutarch js-confdefs.h"
          diff "$RUNNER_TEMP/obj/js/src/js-confdefs.h" "$obj/js/src/js-confdefs.h" || true
          exit "$rc"

      # A probe, not yet a gate: compile every object for our target, keep
      # going past errors, and list the first error of each failing file, so
      # the next patch knows what neo-crt or our source choices still lack.
      - name: compile probe for x86_64-unknown-neoplutarch (network off)
        if: always()
        continue-on-error: true
        run: |
          set +e -u
          obj="$RUNNER_TEMP/obj-neo"
          [ -f "$obj/config.status" ] || { echo "no configured tree"; exit 1; }
          # Until neo-crt's libc++ has localization on main (C3a THINK §10),
          # compile against a copy of its __config_site with it on.
          cfg="$RUNNER_TEMP/cxx-config"
          rm -rf "$cfg" && cp -a "$GITHUB_WORKSPACE/userland/neo-crt/cxx" "$cfg"
          sed -i '/_LIBCPP_HAS_NO_LOCALIZATION/d' "$cfg/__config_site"
          gen="$GITHUB_WORKSPACE/third_party/ot61-mozjs/generator"
          sudo unshare -n -- sudo -u "$(id -un)" env \
            PATH="$PATH" HOME="$HOME" MOZBUILD_STATE_PATH="$RUNNER_TEMP/mozbuild" \
            NEO_REPO="$GITHUB_WORKSPACE" NEO_CLANG=clang NEO_CXX_CONFIG="$cfg" \
            make -C "$obj" -k -j"$(nproc)" compile > "$RUNNER_TEMP/compile-neo.log" 2>&1
          rc=$?
          echo "compile (neoplutarch) exit: $rc"
          echo "== objects built: $(find "$obj" -name '*.o' | wc -l)"
          echo "== error lines: $(grep -c ' error: ' "$RUNNER_TEMP/compile-neo.log")"
          echo "== distinct errors (file: message), most common first"
          grep -E ' error: ' "$RUNNER_TEMP/compile-neo.log" \
            | sed -E 's|^.*/mozjs/||; s|:[0-9]+:[0-9]+: error: |: |' \
            | sort | uniq -c | sort -rn | head -150
          # The link gap: every symbol the objects reference that neither
          # another object nor neo-crt (generator/neo-crt-symbols.txt) defines.
          nm=$(command -v llvm-nm || ls /usr/lib/llvm-*/bin/llvm-nm | tail -1)
          find "$obj" -name '*.o' ! -path '*/host_*' ! -name 'host_*' > "$RUNNER_TEMP/objs.txt"
          xargs "$nm" --defined-only --extern-only --format=just-symbols < "$RUNNER_TEMP/objs.txt" 2>/dev/null \
            | grep -v ':$' | sort -u > "$RUNNER_TEMP/defined.txt"
          xargs "$nm" --undefined-only --format=just-symbols < "$RUNNER_TEMP/objs.txt" 2>/dev/null \
            | grep -v ':$' | sort -u > "$RUNNER_TEMP/undefined.txt"
          grep -v '^#' "$gen/neo-crt-symbols.txt" | sort -u > "$RUNNER_TEMP/crt.txt"
          comm -23 "$RUNNER_TEMP/undefined.txt" "$RUNNER_TEMP/defined.txt" \
            | comm -23 - "$RUNNER_TEMP/crt.txt" > "$RUNNER_TEMP/link-gap.txt"
          echo "== link gap: $(wc -l < "$RUNNER_TEMP/link-gap.txt") symbols (demangled)"
          c++filt < "$RUNNER_TEMP/link-gap.txt" | head -300
          exit "$rc"

      # Bindgen (THINK #89 §1): upstream mozjs-sys's own `build` and
      # `build_bindings`, run by generator/bindings against obj-neo. The tool
      # is built with the network on (crates.io); it runs with it off.
      # libclang parses with neo-cc's target flags (trap B1: the bindings
      # must see __neoplutarch__, or JS::RootingContext's layout is wrong).
      - name: bindgen for jsapi and jsglue (network off)
        run: |
          set -euo pipefail
          obj="$RUNNER_TEMP/obj-neo"
          gen="$GITHUB_WORKSPACE/third_party/ot61-mozjs/generator"
          cfg="$RUNNER_TEMP/cxx-config"
          export NEO_MOZJS_SYS="$MOZJS_SRC/mozjs-sys"
          cargo build -q --release --manifest-path "$gen/bindings/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/bindgen-target"
          tool="$RUNNER_TEMP/bindgen-target/release/neo-mozjs-bindgen"
          # libclang from the same LLVM as `clang`, whose resource headers
          # neo-cc names (a newer libclang rejects older intrinsic headers).
          libclang=$(cd "$(clang -print-resource-dir)/../.." && pwd)
          echo "libclang from $libclang ($(clang --version | head -1))"
          extra=$(NEO_REPO="$GITHUB_WORKSPACE" NEO_CLANG=clang NEO_CXX_CONFIG="$cfg" \
            "$gen/neo-c++" --neo-print-flags | tr '\n' ' ')
          cd "$MOZJS_SRC/mozjs-sys"
          sudo unshare -n -- sudo -u "$(id -un)" env \
            PATH="$PATH" HOME="$HOME" NEO_OBJ="$obj" LIBCLANG_PATH="$libclang" \
            NEO_REPO="$GITHUB_WORKSPACE" NEO_CLANG=clang NEO_CXX_CONFIG="$cfg" \
            TARGET=x86_64-unknown-neoplutarch HOST=x86_64-unknown-linux-gnu \
            OPT_LEVEL=2 DEBUG=false PROFILE=release OUT_DIR="$obj" \
            CARGO_CFG_TARGET_OS=neoplutarch CARGO_CFG_TARGET_ARCH=x86_64 \
            CARGO_CFG_TARGET_VENDOR=unknown CARGO_CFG_TARGET_ENV= \
            CARGO_CFG_TARGET_POINTER_WIDTH=64 CARGO_CFG_TARGET_ENDIAN=little \
            CARGO_CFG_TARGET_FEATURE=fxsr,sse,sse2 \
            CXX_x86_64_unknown_neoplutarch="$gen/neo-c++" \
            AR_x86_64_unknown_neoplutarch="$(dirname "$(readlink -f "$(command -v clang)")")/llvm-ar" \
            CRATE_CC_NO_DEFAULTS=1 \
            BINDGEN_EXTRA_CLANG_ARGS="$extra" \
            "$tool" 2>&1 | tail -40
          ls -la "$obj"/jsapi.rs "$obj"/gluebindings.rs "$obj"/libjsapi.a "$obj"/libjsglue.a
          grep -c 'wasiRecursionDepth' "$obj/jsapi.rs" || { echo "trap B1: the bindings lack wasiRecursionDepth"; exit 1; }

      # The frozen outputs (option (c)): generator/freeze.py writes the
      # compile database and every generated file the compiles read, with
      # absolute paths as @SRC@/@OBJ@/@REPO@. With a committed copy
      # (third_party/ot61-mozjs/generated) this step is the drift check: any
      # difference fails the job. Without one, it prints the frozen set into
      # the log as a checksummed tarball, so it can be committed from there.
      - name: freeze the outputs, and check them against the committed copy
        run: |
          set -euo pipefail
          obj="$RUNNER_TEMP/obj-neo"
          gen="$GITHUB_WORKSPACE/third_party/ot61-mozjs/generator"
          frozen="$RUNNER_TEMP/frozen"
          rm -rf "$frozen"
          python3 -I "$gen/freeze.py" "$obj" "$MOZJS_SRC/mozjs-sys/mozjs" "$GITHUB_WORKSPACE" "$frozen"
          committed="$GITHUB_WORKSPACE/third_party/ot61-mozjs/generated"
          emit() {
            tar -C "$frozen" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cf - . | gzip -n -9 > "$RUNNER_TEMP/frozen.tgz"
            sha256sum "$RUNNER_TEMP/frozen.tgz"
            echo "FROZEN-B64-BEGIN"
            base64 -w 120 "$RUNNER_TEMP/frozen.tgz"
            echo "FROZEN-B64-END"
          }
          if [ -d "$committed" ]; then
            if diff -r "$committed" "$frozen" > "$RUNNER_TEMP/drift.txt"; then
              echo "drift check: the committed outputs match a fresh run"
            else
              echo "DRIFT: the committed outputs differ from a fresh run:"
              head -300 "$RUNNER_TEMP/drift.txt"
              # The fresh set, so an intended change can be committed from
              # here; the job still fails.
              emit
              exit 1
            fi
          else
            echo "no committed copy yet; the frozen set follows"
            emit
          fi

      # normalizer_glue.h: upstream's build.rs writes it with cbindgen; ours is
      # written by hand (generator/include/). cbindgen 0.29.4 (the crate's own
      # build-dependency) is installed from crates.io with the network on,
      # then run over the crate's lib.rs with the network off, and the two
      # headers must agree once comments and blank lines are set aside.
      - name: normalizer_glue.h against cbindgen
        run: |
          set -euo pipefail
          cargo install cbindgen --version 0.29.4 --locked --root "$RUNNER_TEMP/cbindgen" -q
          crate="$MOZJS_SRC/mozjs-extracted-crates/normalizer_glue"
          out="$RUNNER_TEMP/normalizer_glue.h"
          sudo unshare -n -- sudo -u "$(id -un)" env PATH="$PATH" HOME="$HOME" \
            "$RUNNER_TEMP/cbindgen/bin/cbindgen" --config "$crate/cbindgen.toml" \
              --output "$out" "$crate/src/lib.rs"
          strip() {
            python3 -I -c 'import re,sys; t=open(sys.argv[1]).read(); t=re.sub(r"/\*.*?\*/", "", t, flags=re.S); t=re.sub(r"//[^\n]*", "", t); print("\n".join(l.rstrip() for l in t.splitlines() if l.strip()))' "$1"
          }
          if diff <(strip "$out") <(strip third_party/ot61-mozjs/generator/include/normalizer_glue.h); then
            echo "normalizer_glue.h matches cbindgen's"
          else
            echo "normalizer_glue.h differs from cbindgen's; cbindgen wrote:"; cat "$out"
            exit 1
          fi

      - name: What came out (unified files, defines, source lists)
        if: always()
        run: |
          set +e
          obj="$RUNNER_TEMP/obj"
          echo "== configure.log (last 60 lines)"; tail -60 "$RUNNER_TEMP/configure.log"
          echo "== export.log (last 80 lines)"; tail -80 "$RUNNER_TEMP/export.log"
          echo "== js-confdefs.h"; find "$obj" -name js-confdefs.h -exec cat {} \; | head -200
          echo "== Unified_*.cpp files"; find "$obj" -name 'Unified_*.cpp' | sort | head -400
          n=$(find "$obj" -name 'Unified_*.cpp' | wc -l); echo "== unified file count: $n"
          n=$(find "$obj" -name backend.mk | wc -l); echo "== backend.mk files: $n"
          for d in js/src mfbt mozglue/misc modules/fdlibm; do
            f="$obj/$d/backend.mk"; [ -f "$f" ] || continue
            echo "== $d/backend.mk (sources)"; grep -E '^(CPPSRCS|CSRCS|UNIFIED_CPPSRCS)' "$f" | head -20
          done

      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ot61-mozjs-generated
          path: |
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export-files.txt
            ${{ runner.temp }}/configure-neo.log
            ${{ runner.temp }}/export-neo.log
            ${{ runner.temp }}/compile-neo.log
            ${{ runner.temp }}/link-gap.txt
            ${{ runner.temp }}/frozen.tgz
            ${{ runner.temp }}/drift.txt
            ${{ runner.temp }}/obj-neo/js/src/js-confdefs.h
            ${{ runner.temp }}/obj/js/src/js-confdefs.h
            ${{ runner.temp }}/obj/**/Unified_*.cpp
            ${{ runner.temp }}/obj/**/backend.mk
          if-no-files-found: warn
