# NeoPlutarch — Limine bootloader configuration.
#
# Limine reads this file from the boot medium's ESP/root and uses it to
# decide what to load. The kernel binary path here is relative to the
# disk image root. The xtask builder copies the kernel ELF into place at
# `/boot/kernel` before running QEMU.

timeout: 0
default_entry: 1
interface_branding: NeoPlutarch
interface_branding_colour: 6
# Mirror Limine's own console + boot diagnostics to COM1. Without this the
# `-nographic` / `-serial stdio` QEMU flow is dark until the kernel itself
# writes to COM1 — making early kernel-boot failures invisible.
serial: yes

/NeoPlutarch
    protocol: limine
    path: boot():/boot/kernel
    # Phase 1.5c BUILD-3: production KASLR is enabled. The kernel is linked
    # as PIE, requests Limine's executable address response, derives kernel
    # heap placement from the relocated image end, and `kaslr_smoke` gates
    # the non-fixed executable base in CI.
    kaslr: yes
    # Phase 1.4: load neo-init as a module. The kernel reads ModuleResponse,
    # finds this entry by path suffix `/neo-init`, ELF-parses the bytes, and
    # creates a user Process. See kernel/src/main.rs after sched::smoke_test.
    module_path: boot():/modules/neo-init
    # Phase 1.5: neo-worker also loaded as a module. neo-init calls
    # sys_spawn("worker") which looks this up by path-suffix `/neo-worker`.
    module_path: boot():/modules/neo-worker
    # Arthur Slice 1: scenario-gated neo-shell REPL module.
    module_path: boot():/modules/neo-shell
    # Arthur Slice 3: neo-arthur conversation process spawned by neo-shell.
    module_path: boot():/modules/neo-arthur
    # OT-61 C0.5: the neo-std-real-smoke module line is NOT here — it is injected
    # into the staged limine.conf ONLY for the std_real_smoke scenario
    # (tools/xtask inject_std_real_smoke_module), the same conditional-module
    # discipline as the mt7601u-fw blob, so a default/prod ISO never lists it.
