# SPDX-License-Identifier: MIT
# Vendored copy of Frommi/miniz_oxide at 7fc2dd45810e1722272ff77c4238a8f8e0d0da22
# (2026-10-29; crate 0.9.1). Upstream licence kept: LICENSE (MIT text),
# LICENSE-MIT.md, LICENSE-APACHE.md, LICENSE-ZLIB.md; this copy is used under
# MIT. Upstream's manifest is `Cargo.toml.upstream`; this one differs only in
# `publish = false`, the removed `[[bench]]` target (benches are not vendored,
# and upstream excludes them from the crate package), the removed
# `[dev-dependencies]` block (upstream's is commented out), and
# `license = "MIT"` naming the option this copy is used under. `src/` is
# upstream's plus one SPDX line per file (see VENDORED.md).
[package]
name = "miniz_oxide"
authors = ["Frommi <daniil.liferenko@gmail.com>", "oyvindln <oyvindln@users.noreply.github.com>", "Rich Geldreich richgel99@gmail.com"]
version = "0.9.1"
license = "MIT"
readme = "Readme.md"
keywords = ["zlib", "miniz", "deflate", "encoding"]
categories = ["compression"]
repository = "https://github.com/Frommi/miniz_oxide/tree/master/miniz_oxide"
homepage = "https://github.com/Frommi/miniz_oxide/tree/master/miniz_oxide"
documentation = "https://docs.rs/miniz_oxide"
description = "DEFLATE compression and decompression library rewritten in Rust based on miniz"
edition = "2021"
exclude = ["benches/*", "tests/*"]
publish = false

[lib]
name = "miniz_oxide"

[dependencies]
adler2 = { version = "2.0", default-features = false }
simd-adler32 = { version = "0.3.8", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive", "alloc"], default-features = false, optional = true }

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
core = { version = '1.0.0', optional = true, package = 'rustc-std-workspace-core' }
alloc = { version = '1.0.0', optional = true, package = 'rustc-std-workspace-alloc' }

[features]
default = ["with-alloc"]
with-alloc = []
std = ["serde?/std"]
block-boundary = []

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
rustc-dep-of-std = ['core', 'alloc', 'adler2/rustc-dep-of-std']

simd = ['simd-adler32']

# Disable unexpected cfg name warning from to !cfg(fuzzing) - compiler is not aware of the fuzzing feature since it comes from the environment
# see https://github.com/rust-fuzz/cargo-fuzz/issues/372
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
