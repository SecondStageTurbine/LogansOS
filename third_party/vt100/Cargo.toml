# Vendored doy/vt100-rust at fb0f54ec7222f4805f33cd3ca530229e0a0fe6ad; see VENDORED.md.
# Upstream's manifest is Cargo.toml.upstream, unchanged.
[package]
name = "vt100"
version = "0.18.1"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2024"
rust-version = "1.85"
description = "Library for parsing terminal data"
repository = "https://github.com/doy/vt100-rust"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
itoa = "1.0.18"
unicode-width = "0.2.2"
vte = { path = "../vte", default-features = false }
embedded-io = { version = "0.7.1", optional = true }

[features]
default = ["std"]
std = ["vte/std"]
