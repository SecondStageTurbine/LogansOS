# SPDX-License-Identifier: MIT
# Vendored copy of etemesi254/zune-image `crates/zune-jpeg` at
# 2f9086b07cdf5a36621ce18f79d310f99b751de9 (2026-10-24; crate 0.5.16-rc3).
# Upstream licence kept: LICENSE-MIT, LICENSE-APACHE, LICENSE-ZLIB; this copy is
# used under MIT. Upstream's manifest is `Cargo.toml.upstream`; this one differs
# only in `publish = false`, the removed (empty) `[dev-dependencies]` block and
# `license = "MIT"` naming the option this copy is used under. `src/` is
# upstream's plus one SPDX line per .rs file (see VENDORED.md). `zune-core` is
# vendored beside this crate, so upstream's `../zune-core` path dependency is
# unchanged.
[package]
name = "zune-jpeg"
version = "0.5.16-rc3"
rust-version = "1.77.1"
authors = ["caleb <etemesicaleb@gmail.com>"]
edition = "2021"
repository = "https://github.com/etemesi254/zune-image/tree/dev/crates/zune-jpeg"
license = "MIT"
keywords = ["jpeg", "jpeg-decoder", "decoder"]
categories = ["multimedia::images"]
exclude = ["/benches/images/*", "/tests/*", "/.idea/*", "/.gradle/*", "/test-images/*", "fuzz/*"]
description = "A fast, correct and safe jpeg decoder"
publish = false

[lints.rust]
# Disable feature checker for fuzzing since it's used and cargo doesn't
# seem to recognise fuzzing
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
x86 = []
neon = []
std = ["zune-core/std"]
# NOTE: portable_simd requires Rust 1.87+
portable_simd = []
arith = []
log = ["zune-core/log"]
default = ["x86", "neon", "std"]


[dependencies]
zune-core = { path = "../zune-core", version = "0.5.2" }
