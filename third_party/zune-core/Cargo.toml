# SPDX-License-Identifier: MIT
# Vendored copy of etemesi254/zune-image `crates/zune-core` at
# 2f9086b07cdf5a36621ce18f79d310f99b751de9 (2026-10-24; crate 0.5.3).
# Upstream licence kept: LICENSE-MIT, LICENSE-APACHE, LICENSE-ZLIB; this copy is
# used under MIT. Upstream's manifest is `Cargo.toml.upstream`; this one differs
# only in `publish = false` and `license = "MIT"` naming the option this copy is
# used under. `src/` is upstream's plus one SPDX line per .rs file (see
# VENDORED.md).
[package]
name = "zune-core"
version = "0.5.3"
rust-version = "1.75.0"
edition = "2021"
description = "Core utilities for image processing in the zune family of crates"
exclude = ["tests/"]
repository = "https://github.com/etemesi254/zune-image"
keywords = ["image"]
categories = ["multimedia::images", "multimedia::encoding"]
license = "MIT"
publish = false

[features]
# When present, we can use std facilities to detect
# if a specific feature exists
# Not enabled by default. Other zune crates can enable dep:zune-core/std by default.
# But if we enable it here, they can't disable it anymore.
# See: https://github.com/rust-lang/cargo/issues/8366
std = []

[dependencies]
log = { version = "0.4", optional = true }
serde = { version = "1.0", optional = true }
