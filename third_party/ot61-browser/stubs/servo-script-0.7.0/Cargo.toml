# SPDX-License-Identifier: MPL-2.0
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "servo-script"
version = "0.7.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "LogansOS empty stand-in for servo-script 0.7.0 (never compiled for LogansOS)"

[lib]
name = "script"
path = "src/lib.rs"

[features]
"bluetooth" = []
"brotli-compression-stream" = []
"crown" = []
"debugmozjs" = []
"gamepad" = []
"jitspew" = []
"js_backtrace" = []
"js_jit" = []
"profilemozjs" = []
"testbinding" = []
"tracing" = []
"webcrypto" = []
"webgl" = []
"webgl_backtrace" = []
"webgpu" = []
"webxr" = ["webgl", "gamepad"]
"servo-bluetooth-traits" = []
"webxr-api" = []
