# SPDX-License-Identifier: (MIT OR Apache-2.0) AND NCSA
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "libfuzzer-sys"
version = "0.4.13"
edition = "2018"
license = "(MIT OR Apache-2.0) AND NCSA"
repository = "https://github.com/rust-fuzz/libfuzzer"
description = "LogansOS empty stand-in for libfuzzer-sys 0.4.13 (never compiled for LogansOS)"

[lib]
name = "libfuzzer_sys"
path = "src/lib.rs"

[features]
"arbitrary-derive" = []
"default" = ["link_libfuzzer"]
"link_libfuzzer" = []
