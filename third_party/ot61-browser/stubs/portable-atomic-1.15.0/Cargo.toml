# SPDX-License-Identifier: Apache-2.0 OR MIT
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "portable-atomic"
version = "1.15.0"
edition = "2018"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taiki-e/portable-atomic"
description = "LogansOS empty stand-in for portable-atomic 1.15.0 (never compiled for LogansOS)"

[lib]
name = "portable_atomic"
path = "src/lib.rs"

[features]
"default" = ["fallback"]
"disable-fiq" = []
"fallback" = []
"float" = []
"force-amo" = []
"require-cas" = []
"s-mode" = []
"std" = []
"unsafe-assume-privileged" = []
"unsafe-assume-single-core" = []
"critical-section" = []
"serde" = []
