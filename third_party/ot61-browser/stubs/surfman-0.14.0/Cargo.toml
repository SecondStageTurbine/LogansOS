# SPDX-License-Identifier: MIT OR Apache-2.0 OR MPL-2.0
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "surfman"
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0 OR MPL-2.0"
repository = "https://github.com/servo/surfman"
description = "LogansOS empty stand-in for surfman 0.14.0 (never compiled for LogansOS)"

[lib]
name = "surfman"
path = "src/lib.rs"

[features]
"sm-angle" = []
"sm-angle-builtin" = []
"sm-angle-default" = ["sm-angle"]
"sm-no-wgl" = ["sm-angle-default"]
"sm-test" = []
"sm-wayland-default" = []
"sm-x11" = []
"mozangle" = []
"osmesa-sys" = []
"x11-dl" = []
