# SPDX-License-Identifier: MIT
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "objc2"
version = "0.6.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/madsmtm/objc2"
description = "LogansOS empty stand-in for objc2 0.6.5 (never compiled for LogansOS)"

[lib]
name = "objc2"
path = "src/lib.rs"

[features]
"alloc" = []
"catch-all" = ["exception"]
"default" = ["std"]
"disable-encoding-assertions" = []
"exception" = []
"gnustep-1-7" = ["unstable-static-class"]
"gnustep-1-8" = ["gnustep-1-7"]
"gnustep-1-9" = ["gnustep-1-8"]
"gnustep-2-0" = ["gnustep-1-9"]
"gnustep-2-1" = ["gnustep-2-0"]
"objc2-proc-macros" = []
"relax-sign-encoding" = []
"relax-void-encoding" = []
"std" = ["alloc"]
"unstable-apple-new" = []
"unstable-arbitrary-self-types" = []
"unstable-autoreleasesafe" = []
"unstable-coerce-pointee" = []
"unstable-compiler-rt" = ["gnustep-1-7"]
"unstable-darwin-objc" = []
"unstable-gnustep-strict-apple-compat" = ["gnustep-1-7"]
"unstable-objfw" = []
"unstable-requires-macos" = []
"unstable-static-class" = []
"unstable-static-class-inlined" = ["unstable-static-class"]
"unstable-static-sel" = []
"unstable-static-sel-inlined" = ["unstable-static-sel"]
"unstable-winobjc" = ["gnustep-1-8"]
"verify" = []
