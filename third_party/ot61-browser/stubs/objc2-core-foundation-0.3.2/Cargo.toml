# SPDX-License-Identifier: Zlib OR Apache-2.0 OR MIT
# LogansOS stub, not the published crate (third_party/ot61-browser/VENDORED.md,
# "The stubs for other platforms"). It exists only so Cargo can resolve the
# lockfile: no LogansOS build compiles it (its dependents reach it only under
# other targets' cfgs, or as dev/fuzz tooling), and if one ever did, the empty
# crate would fail to compile rather than build wrong.
[package]
name = "objc2-core-foundation"
version = "0.3.2"
edition = "2021"
license = "Zlib OR Apache-2.0 OR MIT"
repository = "https://github.com/madsmtm/objc2"
description = "LogansOS empty stand-in for objc2-core-foundation 0.3.2 (never compiled for LogansOS)"

[lib]
name = "objc2_core_foundation"
path = "src/lib.rs"

[features]
"CFArray" = []
"CFAttributedString" = []
"CFAvailability" = []
"CFBag" = []
"CFBase" = []
"CFBinaryHeap" = []
"CFBitVector" = []
"CFBundle" = []
"CFByteOrder" = []
"CFCGTypes" = []
"CFCalendar" = ["bitflags"]
"CFCharacterSet" = []
"CFData" = ["bitflags"]
"CFDate" = ["bitflags"]
"CFDateFormatter" = ["bitflags"]
"CFDictionary" = []
"CFError" = []
"CFFileDescriptor" = []
"CFFileSecurity" = ["bitflags"]
"CFLocale" = []
"CFMachPort" = []
"CFMessagePort" = []
"CFNotificationCenter" = []
"CFNumber" = []
"CFNumberFormatter" = ["bitflags"]
"CFPlugIn" = []
"CFPlugInCOM" = []
"CFPreferences" = []
"CFPropertyList" = ["bitflags"]
"CFRunLoop" = ["bitflags"]
"CFSet" = []
"CFSocket" = ["bitflags"]
"CFStream" = ["bitflags"]
"CFString" = ["bitflags"]
"CFStringEncodingExt" = []
"CFStringTokenizer" = ["bitflags"]
"CFTimeZone" = []
"CFTree" = []
"CFURL" = ["bitflags"]
"CFURLAccess" = []
"CFURLEnumerator" = ["bitflags"]
"CFUUID" = []
"CFUserNotification" = []
"CFUtilities" = []
"CFXMLNode" = []
"CFXMLParser" = ["bitflags"]
"alloc" = []
