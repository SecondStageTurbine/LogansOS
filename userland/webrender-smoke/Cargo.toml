# SPDX-License-Identifier: MPL-2.0
# Standalone (excluded from the root workspace): OT-61 rung 4, SWGL step S2
# (docs/THINK-2026-10-31-ot61-r4-swgl-floor.md §2): upstream WebRender 0.70
# rendering a display list through SWGL on x86_64-unknown-neoplutarch, over
# neo-crt, compared with a checked-in pixel oracle. Every third-party crate
# resolves to third_party/ot61-swgl through [patch.crates-io];
# wr_glyph_rasterizer is the one patched crate (a neoplutarch font backend).
[workspace]

[package]
name = "webrender-smoke"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "OT-61 rung 4 S2 gate: WebRender 0.70 on SWGL on-target, against a pixel oracle"

[[bin]]
name = "webrender-smoke"
path = "src/main.rs"
test = false
bench = false

[dependencies]
neo-std-pal = { path = "../neo-std-pal" }
neo-crt = { path = "../neo-crt" }
webrender = { version = "=0.70.0", default-features = false, features = ["sw_compositor"] }
swgl = "=0.70.0"
gleam = "=0.15.1"







# Every third-party crate resolves to the vendored closure
# (third_party/ot61-swgl/VENDORED.md); winapi resolves to an empty stub
# (stubs/), and swgl, webrender and wr_glyph_rasterizer to the patched
# copies (patched/). Generated by third_party/ot61-swgl/gen-patch-table.py.
