# SPDX-License-Identifier: MPL-2.0
# Standalone (excluded from the root workspace): OT-61 C2.4, upstream Stylo
# styling an html5ever tree on-target. Every third-party crate comes from the
# vendored closure in third_party/ot61-browser/ (VENDORED.md; survey:
# docs/RESEARCH-2026-10-30-ot61-c2.4-stylo-closure-SURVEY.md).
[workspace]

[package]
name = "stylo-smoke"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "OT-61 C2.4 gate: Stylo computes styles for an html5ever document on-target, checked against hand-derived values"

[[bin]]
name = "stylo-smoke"
path = "src/main.rs"
test = false
bench = false

[dependencies]
neo-std-pal = { path = "../neo-std-pal" }
html5ever = "=0.40.1"
selectors = "=0.41.0"
cssparser = "=0.38.0"
# Stylo with its default `servo` feature set (Servo's embedding of it).
style = { package = "stylo", version = "=0.22.0" }
style_traits = { package = "stylo_traits", version = "=0.22.0" }
style_dom = { package = "stylo_dom", version = "=0.22.0" }
euclid = "=0.22.14"
app_units = "=0.7.8"
url = "=2.5.8"
atomic_refcell = "=0.1.14"

# Every third-party crate resolves to the vendored closure. Generated:
# third_party/ot61-browser/gen-patch-table.py ../../third_party/ot61-browser Cargo.lock
