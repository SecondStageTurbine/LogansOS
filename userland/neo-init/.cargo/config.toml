[build]
target = "../x86_64-neoplutarch-user.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# Static-link, no dynamic linker, 4 KiB page alignment, custom linker script
# emitted by build.rs as an absolute -T<path>.
[target.x86_64-neoplutarch-user]
rustflags = [
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-dynamic-linker",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=0x1000",
]
