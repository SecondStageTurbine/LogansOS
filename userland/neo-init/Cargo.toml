# OT-61 browser C1.0: neo-init runs the VM+clock primitive battery.
vm-primitives = []
# OT-85 gate (kernel `neo-test-wallclock-rtc`): the wall-clock probe. Reads
# CLOCK_REALTIME and CLOCK_MONOTONIC, formats the boot instant (realtime -
# monotonic) with libneo::civil, and exits 0 iff it reads the pinned QEMU RTC
# (Wednesday, October 21, 2026, 5:48 PM) with the base stable within a tick.
wallclock-probe = []
# ...the forced-invalid clock (kernel `rtc-epoch-force-invalid`): exits 0 iff
# realtime stayed boot-relative (== monotonic).
wallclock-probe-fallback = ["wallclock-probe"]
# OT-61 browser C1.1: the in-process threads+futex concurrency battery.
threads-futex = ["libneo/neo-test"]
# OT-61 C1.2: the TLS battery (threads_tls): key isolation, FS.base across a
# switch and a cross-CPU wake, iterated destructors, EPERM, generation check.
threads-tls = ["libneo/neo-test"]
# OT-61 C1.3b (CP-86): the cross-CPU process-retire battery (threads_exit_group).
threads-exit-group = ["libneo/neo-test"]
# OT-61 browser C1.1: cap-confinement + refcount + guard-fault containment
# (spawns the worker child twice: no-cap EPERM, with-cap fault-kill).
threads-guard-fault = []
# CP-46: the same driver; the worker parks its futex sibling with a deadline.
threads-guard-fault-timed = ["threads-guard-fault"]
# OT-61 browser C1.1 (blocker D): composed root-cap battery driver.
