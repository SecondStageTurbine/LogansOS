arthur-memory-delegation = ["arthur-memory-encryption"]
arthur-memory-forgetting = ["arthur-memory-delegation"]
# OT-29 regression driver: loops heavy spawn->reap->spawn of Arthur to reproduce
# the SMP exit/reap thread-slab UAF. Implies arthur-memory only to reuse the
# default-arm exclusion (the driver itself just spawns Arthur over IPC).
