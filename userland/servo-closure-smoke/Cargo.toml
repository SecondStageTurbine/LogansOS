# SPDX-License-Identifier: MPL-2.0
# Standalone (excluded from the root workspace): OT-61 C2.3b, upstream
# html5ever + Stylo's `selectors` linked into a real-std binary for
# x86_64-unknown-neoplutarch. Every third-party crate comes from the vendored
# closure in third_party/ot61-browser/ (see its README for licences and
# upstream SHAs); the build never reaches a registry.
[workspace]

[package]
name = "servo-closure-smoke"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "OT-61 C2.3b gate: parse real HTML with upstream html5ever and run upstream Stylo selector matching on-target"

[[bin]]
name = "servo-closure-smoke"
path = "src/main.rs"
test = false
bench = false

[dependencies]
neo-std-pal = { path = "../neo-std-pal" }
html5ever = "=0.40.1"
selectors = "=0.41.0"
cssparser = "=0.38.0"
# Already in the closure (html5ever's and selectors' own dependencies); named
# here because the smoke checks them directly.
parking_lot = "=0.12.5"
memchr = "=2.8.3"
precomputed-hash = "=0.1.1"

# Every third-party crate resolves to the vendored closure (sources pinned in the
# repo; licences and upstream commits in third_party/ot61-browser/README.md).
# [patch] rather than source replacement: build-std resolves std's own
# dependencies through the same sources, and those are not vendored here.
[patch.crates-io]
bitflags = { path = "../../third_party/ot61-browser/vendor/bitflags-2.13.2" }
cfg-if = { path = "../../third_party/ot61-browser/vendor/cfg-if-1.0.5" }
cssparser = { path = "../../third_party/ot61-browser/vendor/cssparser-0.38.0" }
cssparser-macros = { path = "../../third_party/ot61-browser/vendor/cssparser-macros-0.7.1" }
derive_more = { path = "../../third_party/ot61-browser/vendor/derive_more-2.1.1" }
derive_more-impl = { path = "../../third_party/ot61-browser/vendor/derive_more-impl-2.1.1" }
dtoa = { path = "../../third_party/ot61-browser/vendor/dtoa-1.0.11" }
dtoa-short = { path = "../../third_party/ot61-browser/vendor/dtoa-short-0.3.5" }
fastrand = { path = "../../third_party/ot61-browser/vendor/fastrand-2.5.0" }
html5ever = { path = "../../third_party/ot61-browser/vendor/html5ever-0.40.1" }
itoa = { path = "../../third_party/ot61-browser/vendor/itoa-1.0.18" }
lock_api = { path = "../../third_party/ot61-browser/vendor/lock_api-0.4.14" }
log = { path = "../../third_party/ot61-browser/vendor/log-0.4.34" }
markup5ever = { path = "../../third_party/ot61-browser/vendor/markup5ever-0.40.0" }
memchr = { path = "../../third_party/ot61-browser/vendor/memchr-2.8.3" }
new_debug_unreachable = { path = "../../third_party/ot61-browser/vendor/new_debug_unreachable-1.0.6" }
parking_lot = { path = "../../third_party/ot61-browser/vendor/parking_lot-0.12.5" }
phf = { path = "../../third_party/ot61-browser/vendor/phf-0.14.0" }
phf_codegen = { path = "../../third_party/ot61-browser/vendor/phf_codegen-0.14.0" }
phf_generator = { path = "../../third_party/ot61-browser/vendor/phf_generator-0.14.0" }
phf_macros = { path = "../../third_party/ot61-browser/vendor/phf_macros-0.14.0" }
phf_shared = { path = "../../third_party/ot61-browser/vendor/phf_shared-0.14.0" }
precomputed-hash = { path = "../../third_party/ot61-browser/vendor/precomputed-hash-0.1.1" }
proc-macro2 = { path = "../../third_party/ot61-browser/vendor/proc-macro2-1.0.107" }
quote = { path = "../../third_party/ot61-browser/vendor/quote-1.0.47" }
rustc-hash = { path = "../../third_party/ot61-browser/vendor/rustc-hash-2.1.3" }
rustc_version = { path = "../../third_party/ot61-browser/vendor/rustc_version-0.4.1" }
scopeguard = { path = "../../third_party/ot61-browser/vendor/scopeguard-1.2.0" }
selectors = { path = "../../third_party/ot61-browser/vendor/selectors-0.41.0" }
