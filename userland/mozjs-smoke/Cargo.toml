writeable = { path = "../../third_party/ot61-browser/vendor/writeable-0.6.4" }
yoke = { path = "../../third_party/ot61-browser/vendor/yoke-0.8.4" }
yoke-derive = { path = "../../third_party/ot61-browser/vendor/yoke-derive-0.8.4" }
zerofrom = { path = "../../third_party/ot61-browser/vendor/zerofrom-0.1.8" }
zerofrom-derive = { path = "../../third_party/ot61-browser/vendor/zerofrom-derive-0.1.8" }
zerotrie = { path = "../../third_party/ot61-browser/vendor/zerotrie-0.2.5" }
zerovec = { path = "../../third_party/ot61-browser/vendor/zerovec-0.11.9" }
zerovec-derive = { path = "../../third_party/ot61-browser/vendor/zerovec-derive-0.11.7" }

# The frozen C++ flags carry -gdwarf-4, so an unstripped debug build is about
# 165 MB, too big to stage as a boot module in the scenario's guest. Strip
# debuginfo only: the symbol table stays, and the A4 TCB check reads it.
[profile.dev]
strip = "debuginfo"
