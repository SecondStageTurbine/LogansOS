# SPDX-License-Identifier: MPL-2.0
# Standalone (excluded from the root workspace): OT-61 L0, the closure probe for
# Servo layout without script (Plans/DECISION-2026-11-02-ot61-first-page-option-a.md,
# docs/THINK-2026-11-01-ot61-first-page-layout.md §5). WIP: crates come from
# crates.io until the closure is vendored.
[workspace]

[package]
name = "layout-smoke"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "OT-61 L0/L1 gate: Servo layout without script builds for LogansOS, and its font backend reads the bundled font as hand-read tables say"

[[bin]]
name = "layout-smoke"
path = "src/main.rs"
test = false
bench = false

[dependencies]
neo-std-pal = { path = "../neo-std-pal" }
app_units = "=0.7.8"
fonts = { package = "servo-fonts", version = "=0.7.0" }
fonts_traits = { package = "servo-fonts-traits", version = "=0.7.0" }
style = { package = "stylo", version = "=0.22.0" }
url = "=2.5.8"
layout = { package = "servo-layout", version = "=0.7.0" }
neo-layout-dom = { path = "../neo-layout-dom" }
# servo-constellation-traits 0.7.0 derives Zeroize without enabling zeroize's
# `derive` feature; upstream gets it through servo-script's half of the graph.
zeroize = { version = "1", features = ["derive"] }
# Cross-process channels in-process: there is one process's worth of layout here.
ipc-channel = { version = "=0.23.1", features = ["force-inprocess"] }
# zlib for fontsan, built from libz-sys's bundled source (there is no system zlib).
libz-sys = { version = "1", features = ["static"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

# Every crate comes from third_party/ot61-browser: vendor/ (as published),
# patched/ (with a <crate>-<version>-neoplutarch.patch beside it), or stubs/
# (empty stand-ins for crates the target never compiles; VENDORED.md, "The
# stubs for other platforms"). The table below is generated, never typed:
#   python3 ../../third_party/ot61-browser/gen-patch-table.py ../../third_party/ot61-browser Cargo.lock
# WIP until #66 and #25 land: the 36 crates they vendor under
# third_party/ot61-swgl/vendor (webrender 0.70.0 and SWGL's closure) still
# resolve from crates.io here, and get their entries when #55 rebases onto them.
[patch.crates-io]
accesskit = { path = "../../third_party/ot61-browser/vendor/accesskit-0.24.1" }
