    "tools/virtio-accel-host",
    "tools/quant-drift-tests",
    "tools/xtask",
]
exclude = [
    # Std-only benchmark harness; keep it out of the no_std workspace graph.
    "tools/bench-harness",
    # Host-only inference timing (Arthur latency NOTE); a measurement tool.
    "tools/inference-latency-bench",
    # OT-61 C0.5: the real-std-linked smoke targets x86_64-unknown-neoplutarch
    # with -Z build-std=std (+ restricted_std); it must NOT build for the host
    # workspace (clippy/test). xtask builds it standalone via its own config.
    "userland/std-real-smoke",
    # OT-61 C3a: the browser bundle's private C/C++ runtime. Builds only for
    # x86_64-unknown-neoplutarch (std + clang), as a path dependency of
    # userland/cxx-runtime-smoke; never for the host workspace.
    "userland/neo-crt",
    # OT-61 rung 4: the SWGL S1 smoke (third-party closure in
    # third_party/ot61-swgl); built standalone for the target only.
    "userland/swgl-smoke",
    # OT-61 rung 4 S2: WebRender on SWGL, standalone for the target only.
    "userland/webrender-smoke",
    # OT-61 rung 6: the browser app, standalone for the target only.
    "userland/browser-app",
    # OT-61 C3c-1: the SpiderMonkey smoke (patched mozjs crates in
    # third_party/ot61-mozjs); built standalone for the target only.
    "userland/mozjs-smoke",
    # OT-86 Fix 1: vendored rust-osdev `acpi` 6.1.1 (upstream MIT/Apache-2.0
    # licence and formatting). A path dependency of tools/acpi-aml-grade only;
    # kept out of the workspace so first-party lints and fmt don't apply to it.
    "third_party/acpi-loganfy",
    # OT-87 R4.2: vendored rafalh/rust-fatfs (MIT) at 38b3a795. A path
    # dependency of tools/xtask only (the host ESP-template builder); the
    # kernel never links it.
    "third_party/fatfs",
    # Lane 2a: vendored Frommi/miniz_oxide (MIT OR Zlib OR Apache-2.0; used
    # under MIT) at 7fc2dd45. A path dependency of tools/miniz-oxide-logic-tests
    # only (the host KATs); the kernel does not link it yet.
    "third_party/miniz_oxide",
    # Lane 2b: vendored image-rs/image-png (MIT OR Apache-2.0; used under MIT)
    # at b2f10c6a, and etemesi254/zune-image's zune-jpeg (MIT OR Apache-2.0 OR
    # Zlib; used under MIT) plus its zune-core dependency at 2f9086b0. Path
    # dependencies of libneo's host-only `image-decode` feature,
    # tools/image-decode-logic-tests and tools/image-decode-fuzz; the kernel and
    # OS userland never link them.
    "third_party/png",
    "third_party/zune-core",
    "third_party/zune-jpeg",
    # Lane 1 L1a.2: vendored doy/vt100-rust (MIT) at fb0f54ec and its
    # alacritty/vte dependency (Apache-2.0 OR MIT) at 89c9c22f, both with
    # `std` off. Path dependencies of userland/neo-term-core only; the kernel
    # never links them.
    "third_party/vt100",
    "third_party/vte",
    # Reserved for future phases:
    # "services/neo-inference",
    # "services/neo-models",
    # "services/neo-intent",
    # "services/neo-compositor",
    # "ml/candle-backend",
    # "apps/world-launcher",
    # "apps/mail",
    # "apps/feed",
    # "apps/neo-privacy",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["NeoPlutarch Project"]
license = "MPL-2.0"
repository = "https://github.com/SecondStageTurbine/NeoPlutarch"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

# Optimize the vault's crypto dependencies even in dev builds. Unoptimized
# Argon2id / ChaCha20-Poly1305 block-compression call chains keep tens of KiB of
# 1 KiB `Block` temporaries live on the stack, overflowing the 64 KiB userland
# stack in the debug QEMU build (the vault is the first userland Argon2 consumer).
# opt-level shrinks their stack footprint well under that bound — and speeds the
# KDF — without touching any first-party code or the kernel's stack size.
# Desktop S3: the WM paints and blurs full 1080p planes on the CPU at boot and
# on focus changes. Unoptimized per-pixel loops would cost seconds under TCG;
# this scopes optimization to the one pure scene crate (no other code changes).
[profile.dev.package.neo-atrium]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
# Desktop S2: same reason for the text stack. Debug `ttf_parser::Face::parse`
# plus Arthur's own deep frames overflowed the 64 KiB userland stack in the
# debug QEMU build (product_integration #PF at Face::parse, rsp ~66 KiB down).
# Zenbook ask-freeze: the kernel hashes boot models (485 MB) and every weight
# with BLAKE3. Its x86 compression is prebuilt assembly, but the tree driver
# around it is Rust, recursion-deep and unoptimized in a dev build (39.5 KB of
# stack at 485 MB, CP-74).
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.neo-text]
opt-level = 3
# Zenbook A6: Arthur's vocab parse (151,936 tokens, 5.4 MB) took most of the
# 34 s from its spawn to its model handle. A `build-std` dev build compiles
# `core`, `alloc` and `compiler_builtins` (memcmp/memcpy, from_utf8, the
# BTreeMap internals) unoptimized, unlike a host's prebuilt std, and Arthur's
# own generic collection code with them. In QEMU the parse went from 171 s
# to 2.8 s with these four optimized. (Host builds don't use build-std, so
# cargo notes that the last three match no package there.)
[profile.dev.package.neo-arthur]
opt-level = 3
# L1a.3: the terminal's parser, session and renderer. Unoptimised under TCG
# a one-row redraw took about 0.4 s (#98); only terminal builds link them.
[profile.dev.package.neo-terminal]
opt-level = 3
[profile.dev.package.neo-term-core]
opt-level = 3
[profile.dev.package.vt100]
opt-level = 3
[profile.dev.package.vte]
opt-level = 3
[profile.dev.package.core]
opt-level = 3
[profile.dev.package.alloc]
opt-level = 3
[profile.dev.package.compiler_builtins]
opt-level = 3
